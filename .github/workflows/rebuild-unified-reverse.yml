name: Rebuild unified reverse baseline

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebuild-unified-reverse.yml'
      - 'research/archive/2026-09-11/raw/packages/**'
      - 'research/archive/2026-09-11/raw/local/**/a23078fc21f9ca79.webgl.data.unityweb.bin'
      - 'research/archive/2026-09-11/manifest.json'
      - 'scripts/rebuild_unified_reverse.sh'
      - 'scripts/analyze_split_payload.py'
      - 'scripts/probe_split_brotli.js'
      - 'scripts/analyze_wasmcode2_archive.js'
      - 'scripts/build_wasmcode2_method_crosswalk.py'
      - 'scripts/finalize_wasmcode2_manifest.py'
      - 'scripts/audit_current_baseline.py'
      - 'scripts/unpack_wxapkg.py'
      - 'scripts/build_wasm_method_maps.py'
      - 'scripts/recover_il2cpp_metadata.py'
      - 'scripts/build_archive_manifest.py'

permissions:
  contents: write

concurrency:
  group: rebuild-unified-reverse
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Install reverse-engineering dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y wabt
          wasm2wat --version
          wasm-objdump --version
          test "$(dotnet --version)" = '10.0.400'

      - name: Rebuild unified main + split-WASM baseline
        shell: bash
        run: bash scripts/rebuild_unified_reverse.sh

      - name: Rebuild and finalize wasmcode2 archive crosswalk
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='research/archive/2026-09-11/unpacked/_wasmcode2_/wasmcode2/8bb243383eca8b55.webgl.wasm.code.unityweb.wasm.br'
          OUT='research/archive/2026-09-11/reverse-engineering/modules/wasmcode2'
          CANON='research/archive/2026-09-11/reverse-engineering/canonical'
          mkdir -p "$OUT"

          node scripts/probe_split_brotli.js "$PAYLOAD" "$OUT/brotli-framing-probe.json" /tmp/wasmcode2-framing
          if [ -s /tmp/wasmcode2-framing.decoded.bin ]; then
            python3 scripts/analyze_split_payload.py /tmp/wasmcode2-framing.decoded.bin "$OUT/decoded-body-analysis.json" \
              --name wasmcode2-decoded-body --role 'decoded candidate body from custom-prefix Brotli probe' --brotli-status not-tested
          else
            rm -f "$OUT/decoded-body-analysis.json"
          fi

          node scripts/analyze_wasmcode2_archive.js \
            "$PAYLOAD" "$OUT/archive-format.json" "$OUT/table-value-map.tsv" 367137

          python3 scripts/build_wasmcode2_method_crosswalk.py \
            "$OUT/table-value-map.tsv" \
            "$CANON/method-map.tsv" \
            "$OUT/method-crosswalk.tsv" \
            "$OUT/method-crosswalk-summary.json"

          python3 - "$OUT/method-crosswalk-summary.json" "$OUT/README.md" <<'PY'
          import json, sys
          from pathlib import Path
          summary_path, readme_path = map(Path, sys.argv[1:])
          s = json.loads(summary_path.read_text(encoding='utf-8'))
          c = s['counts']
          present = {x['method_name']: x for x in s['key_method_checks'] if x['present_in_wasmcode2_table_map']}
          lines = [
              '# wasmcode2 runtime split package · 2026-09-11', '',
              'Role: function-split archive consumed by the runtime split manager.', '',
              'The standard Brotli/WASM probe does not identify this member as a standalone WebAssembly module. Loader evidence shows that the bytes are passed to `innerInitFuncSplitWasm({archiveArray})`, and missing functions are requested by shared table id through `innerInvokeWasmBuffer`. See `payload-analysis.json`, `archive-format.json`, and `../split-runtime.md`.', '',
              'This directory now also contains a reproducible crosswalk to the primary C#/RVA namespace. The two namespaces remain semantically distinct: the join is only on the proven shared table id; `archive_value` is intentionally left uninterpreted and must not be treated as a byte offset or function address without further evidence.', '',
              f"- non-sentinel wasmcode2 table slots: {c['wasmcode2_non_sentinel_table_slots']:,}",
              f"- canonical primary C# methods: {c['canonical_primary_methods']:,}",
              f"- primary methods with a wasmcode2 table entry: {c['primary_methods_present_in_wasmcode2_table_map']:,}",
              f"- primary methods without a wasmcode2 table entry: {c['primary_methods_absent_from_wasmcode2_table_map']:,}", '',
              'Among the nine previously hard-validated gameplay methods, the exact-RVA crosswalk currently finds:',
          ]
          for name in ('ResolveOpenedHexOutcome', 'HasPlayerOpenAnchorNeighbor'):
              x = present[name]
              lines.append(f"- `{name}` `{x['rva_hex']}` → canonical `func[{x['canonical_wasm_func']}]` → archive value `{x['archive_value']}`")
          lines += ['', '`method-crosswalk.tsv` is the row-level join and `method-crosswalk-summary.json` is the machine-readable audit. Presence in this map does not prove that a function body exists exclusively in wasmcode2.', '']
          readme_path.write_text('\n'.join(lines), encoding='utf-8')
          PY

          python3 scripts/finalize_wasmcode2_manifest.py "$OUT" "$CANON/manifest.json"
          python3 scripts/build_archive_manifest.py
          python3 scripts/audit_current_baseline.py --reverse-only

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT" "$CANON/manifest.json" research/archive-manifest.json
          if git diff --cached --quiet; then
            echo 'No wasmcode2/final-manifest changes to commit.'
            exit 0
          fi
          git fetch origin master
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo 'master advanced during unified reverse analysis; refusing stale push' >&2
            exit 1
          fi
          git commit -m 'research: finalize unified reverse provenance'
          git push origin HEAD:master
