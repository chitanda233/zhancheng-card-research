name: Rebuild unified reverse baseline

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'research/archive/2026-09-11/raw/packages/**'
      - 'research/archive/2026-09-11/raw/local/**/a23078fc21f9ca79.webgl.data.unityweb.bin'
      - 'research/archive/2026-09-11/manifest.json'
      - 'scripts/rebuild_unified_reverse.sh'
      - 'scripts/build_wasmcode2_package.py'
      - 'scripts/prune_reverse_outputs.py'
      - 'scripts/analyze_split_payload.py'
      - 'scripts/probe_split_brotli.js'
      - 'scripts/analyze_wasmcode2_archive.js'
      - 'scripts/build_wasmcode2_method_crosswalk.py'
      - 'scripts/finalize_wasmcode2_manifest.py'
      - 'scripts/audit_current_baseline.py'
      - 'scripts/unpack_wxapkg.py'
      - 'scripts/build_wasm_method_maps.py'
      - 'scripts/recover_il2cpp_metadata.py'
      - 'scripts/build_archive_manifest.py'

permissions:
  contents: write

# Reverse and docs both write generated files to master. Serialize them so a docs refresh
# cannot advance master while a long reverse rebuild is preparing its final commit.
concurrency:
  group: research-pipeline-master
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.400
            7.0.x

      - name: Install reverse-engineering dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y wabt
          wasm2wat --version
          wasm-objdump --version
          test "$(dotnet --version)" = '10.0.400'
          dotnet --list-runtimes | grep -q '^Microsoft.NETCore.App 7\.'

      - name: Rebuild raw to canonical baseline
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/rebuild_unified_reverse.sh

      - name: Finalize wasmcode2 archive and crosswalk
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_wasmcode2_package.py

      - name: Prune redundant reverse outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prune_reverse_outputs.py
          test ! -e research/archive/2026-09-11/reverse-engineering/canonical/module-info.txt
          test ! -e research/archive/2026-09-11/reverse-engineering/canonical/validation.txt
          test ! -e research/archive/2026-09-11/reverse-engineering/modules/wasmcode1/module-info.txt

      - name: Refresh archive provenance and audit reverse plus docs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_archive_manifest.py
          python3 scripts/audit_current_baseline.py
          if grep -R '"path": "/tmp/' \
              research/archive/2026-09-11/reverse-engineering/canonical/manifest.json \
              research/archive/2026-09-11/reverse-engineering/csharp/manifest.json \
              research/archive/2026-09-11/reverse-engineering/modules/wasmcode1/manifest.json \
              research/archive/2026-09-11/reverse-engineering/modules/wasmcode2/decoded-body-analysis.json; then
            echo 'temporary /tmp path leaked into long-lived reverse provenance' >&2
            exit 1
          fi

      - name: Verify staged provenance and commit once
        shell: bash
        run: |
          set -euo pipefail
          git add -A \
            scripts/rebuild_unified_reverse.sh \
            research/archive/2026-09-11/unpacked \
            research/archive/2026-09-11/reverse-engineering \
            research/archive-manifest.json

          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          manifests = [
              Path('research/archive/2026-09-11/reverse-engineering/csharp/manifest.json'),
              Path('research/archive/2026-09-11/reverse-engineering/canonical/manifest.json'),
              Path('research/archive/2026-09-11/reverse-engineering/modules/wasmcode1/manifest.json'),
              Path('research/archive/2026-09-11/reverse-engineering/modules/wasmcode2/manifest.json'),
          ]
          for manifest_path in manifests:
              data = json.loads(manifest_path.read_text(encoding='utf-8'))
              for item in data.get('files', data.get('generated', [])):
                  path = item['path']
                  blob = subprocess.check_output(['git', 'show', f':{path}'])
                  if len(blob) != item['size'] or hashlib.sha256(blob).hexdigest() != item['sha256']:
                      raise SystemExit(f'Git-index bytes disagree with manifest: {path}')
          print('final reverse Git-index provenance verification OK')
          PY

          if git diff --cached --quiet; then
            echo 'No generated reverse changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo 'master advanced during unified reverse analysis; refusing stale push' >&2
            exit 1
          fi
          git commit -m 'research: rebuild unified reverse baseline'
          git push origin HEAD:master
