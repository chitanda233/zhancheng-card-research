name: Rebuild unified reverse baseline

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebuild-unified-reverse.yml'
      - 'research/archive/2026-09-11/raw/packages/**'
      - 'research/archive/2026-09-11/raw/local/**/a23078fc21f9ca79.webgl.data.unityweb.bin'
      - 'research/archive/2026-09-11/manifest.json'
      - 'scripts/unpack_wxapkg.py'
      - 'scripts/build_wasm_method_maps.py'
      - 'scripts/recover_il2cpp_metadata.py'
      - 'scripts/build_archive_manifest.py'

permissions:
  contents: write

concurrency:
  group: rebuild-unified-reverse
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Install WABT
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y wabt
          wasm2wat --version
          wasm-objdump --version
          dotnet --version

      - name: Verify raw snapshot, unpack packages, recover metadata
        shell: bash
        run: |
          set -euo pipefail
          SNAP='research/archive/2026-09-11'
          RAW_PKG="$SNAP/raw/packages/wx9eed71970378b2ae/16"
          RAW_META="$SNAP/raw/local/wx9eed71970378b2ae/usr/__GAME_FILE_CACHE/a23078fc21f9ca79.webgl.data.unityweb.bin"
          UNPACKED="$SNAP/unpacked"
          ROOT="$SNAP/reverse-engineering"
          META="$ROOT/global-metadata.decrypted.dat"
          rm -rf "$UNPACKED"
          mkdir -p "$ROOT"

          python3 - "$SNAP/manifest.json" "$RAW_PKG" "$RAW_META" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          manifest_path, pkg_dir, raw_meta = map(Path, sys.argv[1:4])
          manifest=json.loads(manifest_path.read_text(encoding='utf-8-sig'))
          records={x['relativePath'].replace('\\','/'):x for x in manifest['files']}
          raw_root=manifest_path.parent/'raw'
          def check(path: Path):
              rel=path.relative_to(raw_root).as_posix()
              rec=records.get(rel)
              if rec is None:
                  raise SystemExit(f'raw file missing from source manifest: {rel}')
              raw=path.read_bytes()
              digest=hashlib.sha256(raw).hexdigest().upper()
              if len(raw)!=rec['bytes'] or digest!=rec['sha256'].upper():
                  raise SystemExit(f'raw snapshot integrity mismatch: {rel}')
          packages=sorted(pkg_dir.glob('*.wxapkg'))
          if len(packages)!=3:
              raise SystemExit(f'expected exactly 3 archived wxapkg files, found {len(packages)}')
          for p in packages: check(p)
          check(raw_meta)
          print('raw snapshot manifest verification OK')
          PY

          python3 scripts/unpack_wxapkg.py "$RAW_PKG" "$UNPACKED"
          python3 scripts/recover_il2cpp_metadata.py "$RAW_META" "$META" > /tmp/metadata-recovery.json
          test -s "$META"

      - name: Decompress canonical WASM
        shell: bash
        run: |
          set -euo pipefail
          SRC='research/archive/2026-09-11/unpacked/_wasmcode_/wasmcode/8bb243383eca8b55.webgl.wasm.code.unityweb.wasm.br'
          WASM='/tmp/current.webgl.wasm'
          node - "$SRC" "$WASM" <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const [src,dst] = process.argv.slice(2);
          const dec = zlib.brotliDecompressSync(fs.readFileSync(src));
          if (!(dec[0]===0x00 && dec[1]===0x61 && dec[2]===0x73 && dec[3]===0x6d)) {
            throw new Error('canonical input did not decompress to WASM');
          }
          fs.writeFileSync(dst, dec);
          NODE
          test -s "$WASM"

      - name: Build pinned Il2CppDumper
        shell: bash
        run: |
          set -euo pipefail
          PIN='8a521b9c180cf13499253f0818cbc729dca767cb'
          SRC='/tmp/Il2CppDumper-src'
          BIN='/tmp/Il2CppDumper-bin'
          rm -rf "$SRC" "$BIN"
          git init -q "$SRC"
          git -C "$SRC" remote add origin https://github.com/Perfare/Il2CppDumper.git
          git -C "$SRC" fetch -q --depth=1 origin "$PIN"
          git -C "$SRC" checkout -q --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$PIN"
          dotnet publish "$SRC/Il2CppDumper/Il2CppDumper.csproj" -c Release -f net7.0 -o "$BIN"
          python3 - "$BIN/config.json" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1])
          cfg=json.loads(p.read_text(encoding='utf-8-sig'))
          cfg.update({
              'DumpMethod':True,
              'DumpField':True,
              'DumpProperty':True,
              'DumpAttribute':True,
              'DumpFieldOffset':True,
              'DumpMethodOffset':True,
              'DumpTypeDefIndex':True,
              'GenerateDummyDll':True,
              'GenerateStruct':False,
              'DummyDllAddToken':True,
              'RequireAnyKey':False,
              'ForceIl2CppVersion':False,
              'ForceDump':False,
              'NoRedirectedPointer':False,
          })
          p.write_text(json.dumps(cfg,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Generate fresh C# declaration package
        shell: bash
        run: |
          set -euo pipefail
          ROOT='research/archive/2026-09-11/reverse-engineering'
          CSHARP="$ROOT/csharp"
          META="$ROOT/global-metadata.decrypted.dat"
          WASM='/tmp/current.webgl.wasm'
          BIN='/tmp/Il2CppDumper-bin'
          PIN='8a521b9c180cf13499253f0818cbc729dca767cb'
          rm -rf "$CSHARP"
          mkdir -p "$CSHARP"

          printf 'CF1EC\n9490C\n' | dotnet "$BIN/Il2CppDumper.dll" "$WASM" "$META" "$CSHARP" | tee "$CSHARP/il2cppdumper.log"

          test -s "$CSHARP/dump.cs"
          test -d "$CSHARP/DummyDll"
          test -n "$(find "$CSHARP/DummyDll" -type f -name '*.dll' -print -quit)"
          grep -q 'Metadata Version: 31' "$CSHARP/il2cppdumper.log"
          grep -q 'CodeRegistration : 848364' "$CSHARP/il2cppdumper.log"
          grep -q 'MetadataRegistration : 608524' "$CSHARP/il2cppdumper.log"
          grep -q 'Dumping...' "$CSHARP/il2cppdumper.log"
          grep -q 'Generate dummy dll...' "$CSHARP/il2cppdumper.log"

          python3 - "$CSHARP" "$WASM" "$META" "$PIN" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          out,wasm,meta=map(Path,sys.argv[1:4]); pin=sys.argv[4]
          def info(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return {'path':str(p),'size':p.stat().st_size,'sha256':h.hexdigest()}
          files=[]
          for p in sorted(x for x in out.rglob('*') if x.is_file() and x.name not in ('manifest.json','README.md')):
              files.append(info(p))
          manifest={
              'schema_version':1,
              'generator':{
                  'name':'Perfare/Il2CppDumper',
                  'tag':'v6.7.46',
                  'commit':pin,
                  'source':'https://github.com/Perfare/Il2CppDumper',
                  'build_target':'net7.0',
                  'dotnet':subprocess.check_output(['dotnet','--version'],text=True).strip(),
                  'GenerateStruct':False,
                  'GenerateDummyDll':True,
              },
              'inputs':{'wasm':info(wasm),'metadata':info(meta)},
              'auto_discovered_registrations':{'CodeRegistration':'0x0CF1EC','MetadataRegistration':'0x09490C'},
              'known_tool_limitation':'GenerateStruct is disabled because v6.7.46 StructGenerator over-reads a protected metadata string-literal index on this title. This does not affect dump.cs generation or DummyDll export.',
              'important_boundary':'dump.cs and DummyDll restore metadata/type declarations, not original executable C# method bodies. Behavior must be verified against canonical WASM disassembly.',
              'files':files,
          }
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          cat > "$CSHARP/README.md" <<'EOF'
          # Canonical C# declaration package · 2026-09-11

          本目录是当前唯一使用的 C# / IL2CPP 声明参考，由 2026-09-11 原始微信小游戏快照重新生成。生成器固定为 `Perfare/Il2CppDumper v6.7.46`，commit `8a521b9c180cf13499253f0818cbc729dca767cb`，workflow 会从该 commit 的源码构建工具，不依赖历史未知版本的 `dump.cs`。

          - `dump.cs`：类型、字段、属性、方法签名、RVA/offset 等声明参考。
          - `DummyDll/`：恢复后的托管程序集骨架，可供 ILSpy/dnSpy/资产工具读取类型信息；不包含原始业务方法体。
          - `il2cppdumper.log`：记录 metadata 版本以及自动定位出的 CodeRegistration / MetadataRegistration。
          - `manifest.json`：固定工具 commit、输入 WASM/metadata hash 和全部生成文件 hash。

          Il2CppDumper v6.7.46 的 `GenerateStruct` 在本项目受保护 metadata 的 string-literal 索引上存在越界，因此统一流程明确关闭该可选输出；Ghidra/低层分析统一使用 `../canonical/` 中由 WABT 生成的 WAT/objdump 和映射表。

          **边界：**这里的 C# 是“声明恢复”，不是原作者源码。IL2CPP 编译后丢失的局部变量名、注释和高级语法无法无损恢复。真实行为统一以 `../canonical/module.wat.gz`、`module.objdump.gz` 为依据，`../canonical/method-map.tsv` 使用本目录 `dump.cs` 作为名称/RVA入口。
          EOF
          sed -i 's/^          //' "$CSHARP/README.md"

      - name: Rebuild canonical WASM package from fresh C# dump
        shell: bash
        run: |
          set -euo pipefail
          SNAP='research/archive/2026-09-11'
          ROOT="$SNAP/reverse-engineering"
          OUT="$ROOT/canonical"
          CSHARP="$ROOT/csharp"
          DUMP="$CSHARP/dump.cs"
          WASM='/tmp/current.webgl.wasm'
          WAT='/tmp/current.wat'
          OBJDUMP='/tmp/current.objdump'
          rm -rf "$OUT"
          mkdir -p "$OUT"

          wasm2wat "$WASM" -o "$WAT"
          wasm-objdump -d "$WASM" > "$OBJDUMP"
          wasm-objdump -x "$WASM" > "$OUT/module-info.txt"
          gzip -n -9 -c "$WAT" > "$OUT/module.wat.gz"
          gzip -n -9 -c "$OBJDUMP" > "$OUT/module.objdump.gz"
          python3 scripts/build_wasm_method_maps.py "$WASM" "$DUMP" "$OUT"

          for f in "$OUT/module.wat.gz" "$OUT/module.objdump.gz"; do
            size=$(stat -c%s "$f")
            if [ "$size" -ge 95000000 ]; then
              split -b 90m -d -a 3 "$f" "$f.part-"
              rm "$f"
            fi
          done

          python3 - "$SNAP" "$WASM" "$ROOT" "$OUT" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          snap,wasm,root,out=map(Path,sys.argv[1:5])
          csharp=root/'csharp'
          src=snap/'unpacked/_wasmcode_/wasmcode/8bb243383eca8b55.webgl.wasm.code.unityweb.wasm.br'
          raw_meta=snap/'raw/local/wx9eed71970378b2ae/usr/__GAME_FILE_CACHE/a23078fc21f9ca79.webgl.data.unityweb.bin'
          metadata=root/'global-metadata.decrypted.dat'
          package_manifest=snap/'unpacked/package-manifest.json'
          raw_manifest=snap/'manifest.json'
          raw_pkg=snap/'raw/packages/wx9eed71970378b2ae/16/_wasmcode_.wxapkg'
          def info(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return {'path':str(p),'size':p.stat().st_size,'sha256':h.hexdigest()}
          packages=json.loads(package_manifest.read_text(encoding='utf-8'))
          main_pkg=next(x for x in packages if x['package']=='_wasmcode_.wxapkg')
          member=next(x for x in main_pkg['files'] if x['file']=='/wasmcode/8bb243383eca8b55.webgl.wasm.code.unityweb.wasm.br')
          app_cfg=json.loads((snap/'unpacked/__WITHOUT_MULTI_PLUGINCODE__/app-config.json').read_text(encoding='utf-8-sig'))
          declared=[]
          for item in app_cfg.get('subPackages', app_cfg.get('subpackages', [])):
              if isinstance(item,dict) and item.get('root'): declared.append(item['root'].strip('/'))
          archived=['wasmcode','wasmcode1']
          capture={
              'declared_subpackages':declared,
              'archived_code_subpackages':archived,
              'declared_but_not_present_as_wxapkg':[x for x in declared if x not in archived],
              'scope_note':'Complete for the three locally archived wxapkg files; absence of other declared subpackages only means they were not present in this local cache snapshot.'
          }
          (root/'capture-completeness.json').write_text(json.dumps(capture,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          generated=[]
          for p in sorted(out.iterdir()):
              if p.name in ('manifest.json','README.md'): continue
              if p.is_file(): generated.append(info(p))
          manifest={
              'schema_version':4,
              'snapshot':'2026-09-11',
              'authoritative_baseline':True,
              'raw_snapshot_manifest':info(raw_manifest),
              'raw_main_wxapkg':info(raw_pkg),
              'unpacked_package_manifest':info(package_manifest),
              'canonical_input_member':member,
              'canonical_input':info(src),
              'decompressed_wasm':info(wasm),
              'metadata_source':info(raw_meta),
              'metadata_recovery_script':info(Path('scripts/recover_il2cpp_metadata.py')),
              'metadata':info(metadata),
              'csharp_manifest':info(csharp/'manifest.json'),
              'csharp_dump':info(csharp/'dump.cs'),
              'method_map_name_source':'research/archive/2026-09-11/reverse-engineering/csharp/dump.cs',
              'legacy_2026_09_03_dump_used':False,
              'capture_completeness':capture,
              'tools':{
                  'Il2CppDumper':{'tag':'v6.7.46','commit':'8a521b9c180cf13499253f0818cbc729dca767cb','GenerateStruct':False},
                  'wasm2wat':subprocess.check_output(['wasm2wat','--version'],text=True).strip(),
                  'wasm-objdump':subprocess.check_output(['wasm-objdump','--version'],text=True).strip(),
              },
              'generated':generated,
          }
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          cat > "$OUT/README.md" <<'EOF'
          # Canonical reverse-engineering package · 2026-09-11

          这是当前唯一低层逆向基准。完整链路为：2026-09-11 原始 `V1MMWX` `.wxapkg` → 解密/解包 → 主 WASM + 原始 UnityWebData → metadata 恢复 → 固定 Il2CppDumper commit 重新生成 `../csharp/dump.cs` / DummyDll → WABT 重新生成完整 WAT/objdump → 使用新的 `../csharp/dump.cs` 建立 RVA / function / 方法名映射。

          本目录不再使用 `2026-09-03/reverse-engineering/dump.cs`。旧快照只保留为历史证据，不参与当前生成、映射或行为判断。

          `method-map.tsv` 的方法名和 RVA 来源固定为 `../csharp/dump.cs`；真实行为必须以 `module.wat.gz` / `module.objdump.gz` 为准。`manifest.json` 记录所有当前输入、工具版本、C# manifest 与生成物 hash。
          EOF
          sed -i 's/^          //' "$OUT/README.md"

      - name: Remove ambiguous current legacy dump aliases
        shell: bash
        run: |
          set -euo pipefail
          ROOT='research/archive/2026-09-11/reverse-engineering'
          rm -f "$ROOT/dump.cs" "$ROOT/dump-provenance.json"

      - name: Validate unified baseline and Git-index bytes
        shell: bash
        run: |
          set -euo pipefail
          ROOT='research/archive/2026-09-11/reverse-engineering'
          CSHARP="$ROOT/csharp"
          OUT="$ROOT/canonical"
          test -s "$CSHARP/dump.cs"
          test -s "$CSHARP/manifest.json"
          test -d "$CSHARP/DummyDll"
          grep -q '"schema_version": 4' "$OUT/manifest.json"
          grep -q '"legacy_2026_09_03_dump_used": false' "$OUT/manifest.json"
          grep -q '"primary_method_rva_unmapped": 0' "$OUT/dump-audit.json"
          grep -q '"duplicate_primary_rva_count": 0' "$OUT/dump-audit.json"
          grep -q 'ALL_OK=True' "$OUT/validation.txt"
          test ! -e "$ROOT/dump.cs"
          test ! -e "$ROOT/dump-provenance.json"

          git add research/archive/2026-09-11/unpacked "$ROOT"
          python3 - "$CSHARP/manifest.json" "$OUT/manifest.json" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          for manifest_path in map(Path,sys.argv[1:]):
              m=json.loads(manifest_path.read_text(encoding='utf-8'))
              items=m['files'] if 'files' in m else m['generated']
              for item in items:
                  path=item['path']
                  data=subprocess.check_output(['git','show',f':{path}'])
                  if len(data)!=item['size'] or hashlib.sha256(data).hexdigest()!=item['sha256']:
                      raise SystemExit(f'Git-index bytes disagree with manifest: {path}')
          print('unified Git-index verification OK')
          PY

      - name: Refresh archive integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_archive_manifest.py

      - name: Commit unified reverse baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/archive/2026-09-11/unpacked research/archive/2026-09-11/reverse-engineering research/archive-manifest.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git fetch origin master
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo 'master advanced during rebuild; refusing a non-fast-forward generated commit' >&2
            exit 1
          fi
          git commit -m 'research: unify reverse baseline with fresh C# dump'
          git push origin HEAD:master
