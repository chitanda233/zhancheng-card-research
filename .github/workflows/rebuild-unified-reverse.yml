name: Rebuild unified reverse baseline

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebuild-unified-reverse.yml'
      - 'research/archive/2026-09-11/raw/packages/**'
      - 'research/archive/2026-09-11/raw/local/**/a23078fc21f9ca79.webgl.data.unityweb.bin'
      - 'research/archive/2026-09-11/manifest.json'
      - 'scripts/rebuild_unified_reverse.sh'
      - 'scripts/analyze_split_payload.py'
      - 'scripts/probe_split_brotli.js'
      - 'scripts/analyze_wasmcode2_archive.js'
      - 'scripts/build_wasmcode2_method_crosswalk.py'
      - 'scripts/unpack_wxapkg.py'
      - 'scripts/build_wasm_method_maps.py'
      - 'scripts/recover_il2cpp_metadata.py'
      - 'scripts/build_archive_manifest.py'

permissions:
  contents: write

concurrency:
  group: rebuild-unified-reverse
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Install reverse-engineering dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y wabt
          wasm2wat --version
          wasm-objdump --version
          dotnet --version

      - name: Rebuild unified main + split-WASM baseline
        shell: bash
        run: bash scripts/rebuild_unified_reverse.sh

      - name: Rebuild wasmcode2 archive map and C# crosswalk
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='research/archive/2026-09-11/unpacked/_wasmcode2_/wasmcode2/8bb243383eca8b55.webgl.wasm.code.unityweb.wasm.br'
          OUT='research/archive/2026-09-11/reverse-engineering/modules/wasmcode2'
          CANON='research/archive/2026-09-11/reverse-engineering/canonical'
          mkdir -p "$OUT"

          node scripts/probe_split_brotli.js "$PAYLOAD" "$OUT/brotli-framing-probe.json" /tmp/wasmcode2-framing
          if [ -s /tmp/wasmcode2-framing.decoded.bin ]; then
            python3 scripts/analyze_split_payload.py /tmp/wasmcode2-framing.decoded.bin "$OUT/decoded-body-analysis.json" \
              --name wasmcode2-decoded-body --role 'decoded candidate body from custom-prefix Brotli probe' --brotli-status not-tested
          else
            rm -f "$OUT/decoded-body-analysis.json"
          fi

          node scripts/analyze_wasmcode2_archive.js \
            "$PAYLOAD" "$OUT/archive-format.json" "$OUT/table-value-map.tsv" 367137

          python3 scripts/build_wasmcode2_method_crosswalk.py \
            "$OUT/table-value-map.tsv" \
            "$CANON/method-map.tsv" \
            "$OUT/method-crosswalk.tsv" \
            "$OUT/method-crosswalk-summary.json"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "$OUT/brotli-framing-probe.json" \
            "$OUT/decoded-body-analysis.json" \
            "$OUT/archive-format.json" \
            "$OUT/table-value-map.tsv" \
            "$OUT/method-crosswalk.tsv" \
            "$OUT/method-crosswalk-summary.json" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No wasmcode2 analysis changes to commit.'
            exit 0
          fi
          git fetch origin master
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo 'master advanced during unified reverse analysis; refusing stale push' >&2
            exit 1
          fi
          git commit -m 'research: rebuild wasmcode2 archive crosswalk'
          git push origin HEAD:master
