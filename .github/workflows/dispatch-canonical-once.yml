name: Dispatch canonical reverse rebuild once

on:
  push:
    paths:
      - '.github/workflows/dispatch-canonical-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical workflow on current master
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rebuild-canonical-reverse.yml --repo "${{ github.repository }}" --ref master
