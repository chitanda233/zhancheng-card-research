name: Rebuild 2026-09-11 reverse snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebuild-2026-09-11-reverse.yml'
      - 'research/archive/2026-09-11/raw/packages/**'
      - 'research/archive/2026-09-11/raw/local/**/a23078fc21f9ca79.webgl.data.unityweb.bin'
      - 'research/archive/2026-09-11/manifest.json'
      - 'scripts/unpack_wxapkg.py'
      - 'scripts/build_wasm_method_maps.py'
      - 'scripts/recover_il2cpp_metadata.py'

permissions:
  contents: write

concurrency:
  group: rebuild-2026-09-11-reverse
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install WABT
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y wabt
          wasm2wat --version
          wasm-objdump --version

      - name: Verify raw snapshot and unpack wxapkg
        shell: bash
        run: |
          set -euo pipefail
          SNAP='research/archive/2026-09-11'
          RAW_PKG="$SNAP/raw/packages/wx9eed71970378b2ae/16"
          RAW_META="$SNAP/raw/local/wx9eed71970378b2ae/usr/__GAME_FILE_CACHE/a23078fc21f9ca79.webgl.data.unityweb.bin"
          UNPACKED="$SNAP/unpacked"
          rm -rf "$UNPACKED"

          python3 - "$SNAP/manifest.json" "$RAW_PKG" "$RAW_META" <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          manifest_path, pkg_dir, raw_meta = map(Path, sys.argv[1:4])
          manifest=json.loads(manifest_path.read_text(encoding='utf-8-sig'))
          records={x['relativePath'].replace('\\','/'):x for x in manifest['files']}
          raw_root=manifest_path.parent/'raw'

          def check(path: Path):
              rel=path.relative_to(raw_root).as_posix()
              rec=records.get(rel)
              if rec is None:
                  raise SystemExit(f'raw file missing from source manifest: {rel}')
              h=hashlib.sha256(path.read_bytes()).hexdigest().upper()
              if path.stat().st_size != rec['bytes'] or h != rec['sha256'].upper():
                  raise SystemExit(f'raw snapshot integrity mismatch: {rel}')

          packages=sorted(pkg_dir.glob('*.wxapkg'))
          if len(packages) != 3:
              raise SystemExit(f'expected exactly 3 archived wxapkg files, found {len(packages)}')
          for p in packages: check(p)
          check(raw_meta)
          print('raw snapshot manifest verification OK')
          PY

          python3 scripts/unpack_wxapkg.py "$RAW_PKG" "$UNPACKED"

      - name: Prove code-package identity and rebuild metadata
        shell: bash
        run: |
          set -euo pipefail
          SNAP='research/archive/2026-09-11'
          UNPACKED="$SNAP/unpacked"
          ROOT="$SNAP/reverse-engineering"
          RAW_META="$SNAP/raw/local/wx9eed71970378b2ae/usr/__GAME_FILE_CACHE/a23078fc21f9ca79.webgl.data.unityweb.bin"
          OLD_UNPACKED='research/archive/2026-09-03/unpacked/package-manifest.json'
          OLD_META='research/archive/2026-09-03/reverse-engineering/global-metadata.decrypted.dat'
          OLD_DUMP='research/archive/2026-09-03/reverse-engineering/dump.cs'
          mkdir -p "$ROOT"

          python3 - "$UNPACKED/package-manifest.json" "$OLD_UNPACKED" <<'PY'
          import json, sys
          from pathlib import Path
          new=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          old=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          nh={x['package']:x['sha256'] for x in new}
          oh={x['package']:x['sha256'] for x in old}
          if nh != oh:
              raise SystemExit(f'2026-09-11 wxapkg set is not byte-identical to the prior code package set: new={nh} old={oh}')
          print('all archived wxapkg files are byte-identical to the previous package set')
          PY

          python3 scripts/recover_il2cpp_metadata.py "$RAW_META" /tmp/global-metadata.recovered.dat > /tmp/metadata-recovery.json
          cmp -s /tmp/global-metadata.recovered.dat "$OLD_META" || {
            echo 'recovered metadata differs from the previous declaration reference; refusing to reuse dump.cs' >&2
            exit 1
          }
          cp /tmp/global-metadata.recovered.dat "$ROOT/global-metadata.decrypted.dat"
          cp "$OLD_DUMP" "$ROOT/dump.cs"

          python3 - "$ROOT/dump-provenance.json" "$OLD_DUMP" "$OLD_META" "$ROOT/global-metadata.decrypted.dat" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          out,old_dump,old_meta,new_meta=map(Path,sys.argv[1:5])
          def info(p):
              raw=p.read_bytes(); return {'path':str(p),'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          payload={
            'status':'reused-by-byte-identity',
            'reason':'The 2026-09-11 archived wxapkg set is byte-identical to the prior package set and metadata recovered from the new raw UnityWebData is byte-identical to the prior metadata. Therefore the prior dump.cs declaration snapshot is valid for this code image.',
            'important_boundary':'dump.cs is still a declaration/name/layout reference. Its original Il2CppDumper/Cpp2IL generator/version is unknown and its empty C# bodies are not executable behavior.',
            'source_dump':info(old_dump),
            'source_metadata':info(old_meta),
            'new_metadata':info(new_meta),
          }
          out.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Re-decompile WASM and rebuild maps
        shell: bash
        run: |
          set -euo pipefail
          SNAP='research/archive/2026-09-11'
          ROOT="$SNAP/reverse-engineering"
          OUT="$ROOT/canonical"
          SRC="$SNAP/unpacked/_wasmcode_/wasmcode/8bb243383eca8b55.webgl.wasm.code.unityweb.wasm.br"
          DUMP="$ROOT/dump.cs"
          WASM='/tmp/current.webgl.wasm'
          WAT='/tmp/current.wat'
          OBJDUMP='/tmp/current.objdump'
          rm -rf "$OUT"
          mkdir -p "$OUT"

          node - "$SRC" "$WASM" <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const [src,dst] = process.argv.slice(2);
          const raw = fs.readFileSync(src);
          const dec = zlib.brotliDecompressSync(raw);
          if (!(dec[0]===0x00 && dec[1]===0x61 && dec[2]===0x73 && dec[3]===0x6d)) throw new Error('input did not decompress to WASM');
          fs.writeFileSync(dst, dec);
          NODE

          wasm2wat "$WASM" -o "$WAT"
          wasm-objdump -d "$WASM" > "$OBJDUMP"
          wasm-objdump -x "$WASM" > "$OUT/module-info.txt"
          gzip -n -9 -c "$WAT" > "$OUT/module.wat.gz"
          gzip -n -9 -c "$OBJDUMP" > "$OUT/module.objdump.gz"
          python3 scripts/build_wasm_method_maps.py "$WASM" "$DUMP" "$OUT"

          for f in "$OUT/module.wat.gz" "$OUT/module.objdump.gz"; do
            size=$(stat -c%s "$f")
            if [ "$size" -ge 95000000 ]; then
              split -b 90m -d -a 3 "$f" "$f.part-"
              rm "$f"
            fi
          done

          python3 - "$SNAP" "$SRC" "$WASM" "$ROOT" "$OUT" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          snap,src,wasm,root,out=map(Path,sys.argv[1:6])
          package_manifest=snap/'unpacked/package-manifest.json'
          raw_manifest=snap/'manifest.json'
          raw_meta=snap/'raw/local/wx9eed71970378b2ae/usr/__GAME_FILE_CACHE/a23078fc21f9ca79.webgl.data.unityweb.bin'
          metadata=root/'global-metadata.decrypted.dat'
          dump=root/'dump.cs'
          provenance=root/'dump-provenance.json'

          def info(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return {'path':str(p),'size':p.stat().st_size,'sha256':h.hexdigest()}

          packages=json.loads(package_manifest.read_text(encoding='utf-8'))
          main_pkg=next(x for x in packages if x['package']=='_wasmcode_.wxapkg')
          member_name='/wasmcode/8bb243383eca8b55.webgl.wasm.code.unityweb.wasm.br'
          main_member=next(x for x in main_pkg['files'] if x['file']==member_name)
          raw_pkg=snap/'raw/packages/wx9eed71970378b2ae/16/_wasmcode_.wxapkg'

          app_cfg=json.loads((snap/'unpacked/__WITHOUT_MULTI_PLUGINCODE__/app-config.json').read_text(encoding='utf-8-sig'))
          declared=[]
          for item in app_cfg.get('subPackages', app_cfg.get('subpackages', [])):
              if isinstance(item,dict) and item.get('root'): declared.append(item['root'].strip('/'))
          archived=['wasmcode','wasmcode1']
          missing=[x for x in declared if x not in archived]
          capture={
              'declared_subpackages':declared,
              'archived_code_subpackages':archived,
              'declared_but_not_present_as_wxapkg':missing,
              'scope_note':'The Git snapshot is complete for the three locally archived wxapkg files. Missing declared subpackages may have been on-demand/not cached; this does not prove online absence.'
          }
          (root/'capture-completeness.json').write_text(json.dumps(capture,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          generated=[]
          for p in sorted(out.iterdir()):
              if p.name in ('manifest.json','README.md'): continue
              generated.append(info(p))

          manifest={
              'schema_version':3,
              'snapshot':'2026-09-11',
              'raw_snapshot_manifest':info(raw_manifest),
              'raw_main_wxapkg':info(raw_pkg),
              'unpacked_package_manifest':info(package_manifest),
              'canonical_input_member':main_member,
              'canonical_input':info(src),
              'decompressed_wasm':info(wasm),
              'metadata_source':info(raw_meta),
              'metadata_recovery_script':info(Path('scripts/recover_il2cpp_metadata.py')),
              'metadata_rebuild_verified_against_prior_reference':True,
              'metadata_reference':info(metadata),
              'dump_declaration_reference':info(dump),
              'dump_provenance':json.loads(provenance.read_text(encoding='utf-8')),
              'capture_completeness':capture,
              'tools':{
                  'wasm2wat':subprocess.check_output(['wasm2wat','--version'],text=True).strip(),
                  'wasm-objdump':subprocess.check_output(['wasm-objdump','--version'],text=True).strip(),
              },
              'generated':generated,
          }
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          cat > "$OUT/README.md" <<'EOF'
          # Canonical reverse-engineering package · 2026-09-11

          本目录由 `research/archive/2026-09-11/raw/` 中实际归档的原始微信小游戏文件重新生成，不再依赖“只有解包结果、没有原始 wxapkg”的来源链。

          处理链：原始 `.wxapkg` → `scripts/unpack_wxapkg.py` 解包 → Brotli 解压主 WASM → WABT 全量生成 WAT/objdump → `scripts/build_wasm_method_maps.py` 建立 table-slot/RVA/方法名映射；原始 UnityWebData 同时通过 `scripts/recover_il2cpp_metadata.py` 重新恢复 metadata。

          本次三个 `.wxapkg` 与 2026-09-03 记录的包 SHA-256 全部 byte-identical，重新恢复的 metadata 也与旧 reference byte-identical，因此旧 `dump.cs` 声明快照可以安全复用。本目录仍不把 `dump.cs` 视为“恢复出的真实 C# 源码”：其原生成工具/版本未知，方法体为空不代表真实逻辑，行为结论必须以 `module.wat.gz` / `module.objdump.gz` 为准。

          `manifest.json` 记录完整输入 hash、原包、包内成员、metadata、dump provenance、工具版本和生成物 hash；`capture-completeness.json` 记录 `app-config.json` 声明但本地原始包目录未出现的 subpackage，避免把“本机已缓存完整”误写成“线上全部资源完整”。
          EOF
          sed -i 's/^          //' "$OUT/README.md"

      - name: Validate exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          SNAP='research/archive/2026-09-11'
          OUT="$SNAP/reverse-engineering/canonical"
          grep -q '"schema_version": 3' "$OUT/manifest.json"
          grep -q '"primary_method_rva_unmapped": 0' "$OUT/dump-audit.json"
          grep -q '"duplicate_primary_rva_count": 0' "$OUT/dump-audit.json"
          grep -q 'ALL_OK=True' "$OUT/validation.txt"
          test -s "$SNAP/unpacked/package-manifest.json"
          test -s "$SNAP/reverse-engineering/global-metadata.decrypted.dat"
          test -s "$SNAP/reverse-engineering/dump.cs"
          test -s "$SNAP/reverse-engineering/capture-completeness.json"

          git add "$SNAP/unpacked" "$SNAP/reverse-engineering"
          python3 - "$OUT/manifest.json" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          manifest=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          for item in manifest['generated']:
              data=subprocess.check_output(['git','show',f":{item['path']}"])
              if len(data)!=item['size'] or hashlib.sha256(data).hexdigest()!=item['sha256']:
                  raise SystemExit(f"Git-index bytes disagree with manifest: {item['path']}")
          print('Git-index manifest verification OK')
          PY

      - name: Refresh archive integrity manifest
        run: python3 scripts/build_archive_manifest.py

      - name: Commit regenerated snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/archive/2026-09-11/unpacked research/archive/2026-09-11/reverse-engineering research/archive-manifest.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git fetch origin master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" || {
            echo 'master advanced during rebuild; refusing a stale push' >&2
            exit 1
          }
          git commit -m 'research: rebuild 2026-09-11 reverse snapshot from raw packages'
          git push origin HEAD:master
