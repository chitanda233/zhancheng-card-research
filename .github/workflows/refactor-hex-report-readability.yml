name: Refactor hex report readability

on:
  push:
    branches:
      - refactor/hex-report-readability
    paths:
      - 'scripts/_tmp_refactor_hex_report.py'
      - 'scripts/_tmp_fix_refactor_heading.py'
      - '.github/workflows/refactor-hex-report-readability.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/hex-report-readability
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check markdown pillow
      - name: Fix refactor helper
        run: python scripts/_tmp_fix_refactor_heading.py
      - name: Refactor source
        run: python scripts/_tmp_refactor_hex_report.py
      - name: Rebuild hex report and public docs
        run: |
          python scripts/build_hex_random_report.py
          python scripts/build_public_site.py
      - name: Audit and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_current_baseline.py --docs-only --output outputs/current-docs-audit.json
          grep -q '第三层：初始化时选定并保存具体隐藏建筑' scripts/hex_random_report.md
          grep -q '第三层结束时.*底牌.*Architecture' scripts/hex_random_report.md
          grep -q '卡组如何影响第三层候选' scripts/hex_random_report.md
          grep -q '第三层：初始化时选定并保存具体隐藏建筑' docs/reports/hex-random/report.md
          grep -q '卡组如何影响第三层候选' docs/reports/hex-random/report.md
          grep -q '点击时哪些结果仍可能变化' docs/reports/hex-random/report.md
          grep -q '函数证据索引' docs/reports/hex-random/report.md
          ! grep -q '### 2.4 外部组卡约束与内部战斗逻辑' scripts/hex_random_report.md
      - name: Remove one-shot helpers
        run: rm -f scripts/_tmp_refactor_hex_report.py scripts/_tmp_fix_refactor_heading.py .github/workflows/refactor-hex-report-readability.yml
      - name: Commit refactor and generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A scripts/hex_random_report.md outputs/hex-random docs/reports/hex-random outputs/current-docs-audit.json scripts/_tmp_refactor_hex_report.py scripts/_tmp_fix_refactor_heading.py .github/workflows/refactor-hex-report-readability.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'docs: restructure hex generation explanation'
          git push origin HEAD:refactor/hex-report-readability
