name: Ad negative-treatment deep trace
on:
  push:
    branches:
      - research/ad-negative-treatment
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ad-negative-treatment
          fetch-depth: 1
      - name: Deep trace user ad labels and battle modifiers
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib, gzip
          root=pathlib.Path(".")
          dump=root/"research/archive/2026-09-11/reverse-engineering/csharp/dump.cs"
          lines=dump.read_text("utf-8",errors="ignore").splitlines()

          def print_context(needle, before=80, after=100, all_hits=False):
            print(f"===== CONTEXT {needle} =====")
            hits=[i for i,l in enumerate(lines) if needle.lower() in l.lower()]
            print("HITS",hits[:20], "COUNT",len(hits))
            for idx,i in enumerate(hits[:20] if all_hits else hits[:1]):
              a=max(0,i-before); b=min(len(lines),i+after)
              print(f"--- HIT {idx+1} line {i+1} ---")
              for j in range(a,b):
                print(f"{j+1}: {lines[j][:2000]}")

          for needle in [
            "HasWatchedAd", "public class UserLableData", "enum UserLable",
            "RefreshUserLableHasWatchedAdData", "RefreshUserAdUserLable",
            "EnmeyDifficultyLevelHandle", "EnmeyOpenHexOffsetHandle",
            "UserOpenLendaryCardOddHandle", "EnemyOpenLendaryCardOddHandle",
            "BattleUserLabelState"
          ]:
            print_context(needle)

          mm=(root/"research/archive/2026-09-11/reverse-engineering/canonical/method-map.tsv").read_text("utf-8",errors="ignore").splitlines()
          targets={}
          names=[
            "RefreshUserLableHasWatchedAdData","RefreshUserAdUserLable",
            "EnmeyDifficultyLevelHandle","EnmeyOpenHexOffsetHandle",
            "UserOpenLendaryCardOddHandle","EnemyOpenLendaryCardOddHandle",
            "RefreshUserSomeLable","TryGetUserCategoryLevel",
            "ResolveUserLabelState","BuildUserLabelsText"
          ]
          for line in mm:
            if any(n in line for n in names):
              p=line.split("\t")
              if len(p)>=3 and p[2].isdigit():
                targets[int(p[2])]=line
          print("===== TARGETS =====")
          for k,v in sorted(targets.items()): print(k,v)

          wat=root/"research/archive/2026-09-11/reverse-engineering/canonical/module.wat.gz"
          obj=root/"research/archive/2026-09-11/reverse-engineering/canonical/module.objdump.gz"
          print("===== FORMAT SAMPLES =====")
          if wat.exists():
            with gzip.open(wat,"rt",encoding="utf-8",errors="ignore") as fh:
              for _ in range(80):
                s=fh.readline()
                if not s: break
                print("WAT",s.rstrip()[:2000])
          if obj.exists():
            with gzip.open(obj,"rt",encoding="utf-8",errors="ignore") as fh:
              for _ in range(80):
                s=fh.readline()
                if not s: break
                print("OBJ",s.rstrip()[:2000])

          # Extract WAT bodies using wabt index comment syntax: (func (;123;)
          if wat.exists():
            with gzip.open(wat,"rt",encoding="utf-8",errors="ignore") as fh:
              wlines=fh.readlines()
            headers={}
            hpat=re.compile(r'^\s*\(func\s+\(;([0-9]+);\)')
            for i,l in enumerate(wlines):
              m=hpat.match(l)
              if m: headers[int(m.group(1))]=i
            print("WAT_HEADER_COUNT",len(headers))
            for fid,line in sorted(targets.items()):
              print(f"===== WAT FUNC {fid} :: {line} =====")
              if fid not in headers:
                print("NO_WAT_HEADER")
                continue
              i=headers[fid]
              # next func header or 1200 lines
              nxt=min([x for x in headers.values() if x>i], default=min(len(wlines),i+1200))
              for l in wlines[i:min(nxt,i+1200)]:
                print(l.rstrip()[:2400])

            print("===== CALLERS OF TARGET FUNCS =====")
            for fid,line in sorted(targets.items()):
              # WAT calls look like call <idx> or call $name; numeric in this build likely call 123
              pats=[re.compile(rf'\bcall\s+{fid}\b'), re.compile(rf'\bcall\s+\(;?{fid};?\)')]
              hits=[]
              for i,l in enumerate(wlines):
                if any(p.search(l) for p in pats): hits.append(i)
              print(f"TARGET {fid} CALL_HITS {len(hits)} :: {line}")
              for i in hits[:80]:
                # find containing function header
                h=None
                for j in range(i,-1,-1):
                  m=hpat.match(wlines[j])
                  if m:
                    h=(int(m.group(1)),j,wlines[j].strip()); break
                print("CALLER",h, "LINE", i+1, wlines[i].strip()[:1200])
          PY
