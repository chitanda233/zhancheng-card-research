name: Ad negative-treatment focused trace
on:
  push:
    branches:
      - research/ad-negative-treatment
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ad-negative-treatment
          fetch-depth: 1
      - name: Focused trace
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib, gzip
          root=pathlib.Path(".")
          dump=root/"research/archive/2026-09-11/reverse-engineering/csharp/dump.cs"
          lines=dump.read_text("utf-8",errors="ignore").splitlines()

          def enclosing_type(i):
            for j in range(i,-1,-1):
              s=lines[j].strip()
              if re.search(r'\b(class|struct|enum)\b',s) and ('TypeDefIndex' in s or s.endswith('{') or ' enum ' in ' '+s+' '):
                return j,s
            return max(0,i-1),"(none)"

          for needle in ["HasWatchedAd","RefreshUserLableHasWatchedAdData","RefreshUserAdUserLable"]:
            print("\n===== DECL",needle,"=====")
            for i,l in enumerate(lines):
              if needle.lower() in l.lower():
                j,t=enclosing_type(i)
                print("TYPE",j+1,t)
                for k in range(max(j,i-45),min(len(lines),max(i+65,j+150))):
                  print(f"{k+1}: {lines[k][:1800]}")
                break

          # Print full UserLable enum and UserLableData field block.
          for needle in ["UserLableManager.UserLable", "class UserLableData"]:
            print("\n===== TYPE SEARCH",needle,"=====")
            found=[]
            for i,l in enumerate(lines):
              if needle.lower() in l.lower() and re.search(r'\b(class|struct|enum)\b',l):
                found.append(i)
            for i in found[:4]:
              for k in range(i,min(len(lines),i+180)):
                print(f"{k+1}: {lines[k][:1800]}")
                if k>i+3 and lines[k].startswith("// Namespace:"): break

          mm=(root/"research/archive/2026-09-11/reverse-engineering/canonical/method-map.tsv").read_text("utf-8",errors="ignore").splitlines()
          target_names=[
            "RefreshUserLableHasWatchedAdData","RefreshUserAdUserLable",
            "EnmeyDifficultyLevelHandle","EnmeyOpenHexOffsetHandle",
            "UserOpenLendaryCardOddHandle","EnemyOpenLendaryCardOddHandle",
            "RefreshUserSomeLable","TryGetUserCategoryLevel",
            "ResolveUserLabelState","BuildUserLabelsText",
            "RecordWatchAdCount","RecordUserWathcAdCount"
          ]
          targets={}
          for line in mm:
            if any(n in line for n in target_names):
              p=line.split("\t")
              if len(p)>=3 and p[2].isdigit():
                targets[int(p[2])]=line
          print("\n===== TARGET IDS =====")
          for fid,v in sorted(targets.items()): print(fid,v)

          wat=root/"research/archive/2026-09-11/reverse-engineering/canonical/module.wat.gz"
          if not wat.exists():
            print("NO WAT"); raise SystemExit

          # Detect real function header syntax from first 5000 func-looking lines.
          print("\n===== WAT FUNC HEADER SAMPLES =====")
          samples=0
          with gzip.open(wat,"rt",encoding="utf-8",errors="ignore") as fh:
            for ln,line in enumerate(fh,1):
              if "(func" in line:
                print(ln,line.rstrip()[:1800])
                samples+=1
                if samples>=20: break

          # Flexible header detector.
          pats=[
            re.compile(r'^\s*\(func\s+\(;\s*(\d+)\s*;\)'),
            re.compile(r'^\s*\(func\s+\$(?:[^\s]+)?\s*\(;\s*(\d+)\s*;\)'),
            re.compile(r'^\s*\(func\s+(\d+)\b'),
          ]
          def header_id(line):
            for p in pats:
              m=p.search(line)
              if m: return int(m.group(1))
            return None

          bodies={fid:[] for fid in targets}
          callers={fid:[] for fid in targets}
          current=None
          with gzip.open(wat,"rt",encoding="utf-8",errors="ignore") as fh:
            for ln,line in enumerate(fh,1):
              hid=header_id(line)
              if hid is not None:
                current=hid
              if current in bodies and len(bodies[current])<1400:
                bodies[current].append((ln,line.rstrip()))
              if "call" in line:
                nums=[int(x) for x in re.findall(r'\bcall\s+(\d+)\b',line)]
                for n in nums:
                  if n in callers and len(callers[n])<120:
                    callers[n].append((current,ln,line.strip()))

          for fid,v in sorted(targets.items()):
            print(f"\n===== BODY FUNC {fid}: {v} =====")
            if not bodies[fid]:
              print("NO BODY CAPTURED")
            else:
              for ln,s in bodies[fid]: print(f"{ln}: {s[:2200]}")
            print(f"===== CALLERS FUNC {fid} COUNT {len(callers[fid])} =====")
            for x in callers[fid]: print(x)
          PY
