name: Ad negative-treatment research trace
on:
  push:
    branches:
      - research/ad-negative-treatment
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ad-negative-treatment
          fetch-depth: 1
      - name: Trace ad-state fields and consumers
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib, gzip
          root=pathlib.Path(".")
          dump=root/"research/archive/2026-09-11/reverse-engineering/csharp/dump.cs"
          lines=dump.read_text("utf-8",errors="ignore").splitlines()

          def owner_of(idx):
            for j in range(idx,-1,-1):
              if re.match(r'^(public|private|internal|protected).*\b(class|struct|enum)\b',lines[j].strip()):
                return j, lines[j]
            return max(0,idx-40), "(owner not found)"

          print("===== FIELD OWNERS / CLASS CONTEXT =====")
          for needle in ["HasWatchedAd","class PlayerAdData","RecordWatchAdCount","RecordUserWathcAdCount","UpdateTxtWatchADPackCount"]:
            print(f"### NEEDLE {needle}")
            for i,l in enumerate(lines):
              if needle.lower() in l.lower():
                j,owner=owner_of(i)
                print("OWNER",j+1,owner)
                a=max(j,i-35); b=min(len(lines),max(i+45,j+120))
                for k in range(a,b):
                  print(f"{k+1}: {lines[k][:1800]}")
                print("--- END CONTEXT ---")
                break

          methodmap=root/"research/archive/2026-09-11/reverse-engineering/canonical/method-map.tsv"
          mmap=methodmap.read_text("utf-8",errors="ignore").splitlines()
          exact=[
            "ADSIMHelper","AdButtonManager","AdButtonExtend",
            "ShopManager","PlayerShopData","PlayerAdData",
            "UserLableManager","BattleCoreOfflinePveLoadoutBuilder","BattleOpponentInfoProvider",
            "BattleResultPanel","ReportManager","AdsManager","DBTSDKManager"
          ]
          kws=["WatchAd","WathcAd","RewardAd","NoAds","NoAD","VideoBtn","RemoveRewardAd",
               "InactiveUser","LosingStreak","WinningStreak","JustPaidUser","UserLabel","UserLable",
               "Morale","Defeat","SuccessPack","Idle"]
          print("===== TARGET METHOD MAP =====")
          selected=[]
          for line in mmap:
            if (any(x in line for x in exact) and any(k.lower() in line.lower() for k in kws)) or                any(s in line for s in [
                 "ADSIMHelper\tpublic int GetVideoBtnData",
                 "ShopManager\tpublic void RecordWatchAdCount",
                 "ShopManager\tpublic void ResetWatchAdCount",
                 "PlayerShopData\tpublic void RecordUserWathcAdCount",
                 "BattleResultPanel\tprivate void UpdateTxtWatchADPackCount",
                 "AdButtonManager\tprivate bool get_IsRemoveRewardAd",
                 "ReportManager\tpublic void NewReportVideoNoAds"
               ]):
              print(line)
              parts=line.split("\t")
              if len(parts)>=3 and parts[2].isdigit():
                selected.append((int(parts[2]),line))
          # Also include every method owned by PlayerAdData and UserLableManager.
          for line in mmap:
            if "\tPlayerAdData\t" in line or "\tUserLableManager\t" in line:
              print(line)
              parts=line.split("\t")
              if len(parts)>=3 and parts[2].isdigit():
                selected.append((int(parts[2]),line))
          # unique, cap relevant body extraction
          uniq={}
          for fid,line in selected: uniq[fid]=line
          print("SELECTED_FUNC_IDS", sorted(uniq))

          obj=root/"research/archive/2026-09-11/reverse-engineering/canonical/module.objdump.gz"
          print("===== TARGET WASM FUNCTION BODIES =====")
          if obj.exists():
            wanted=set(uniq)
            with gzip.open(obj,"rt",encoding="utf-8",errors="ignore") as fh:
              data=fh.readlines()
            # Headers commonly contain <func[N]>; collect first header exact match.
            for fid in sorted(wanted):
              pat=f"<func[{fid}]>"
              starts=[i for i,l in enumerate(data) if pat in l]
              print(f"### FUNC {fid} {uniq[fid]}")
              if not starts:
                print("BODY_HEADER_NOT_FOUND")
                continue
              i=starts[0]
              for l in data[i:min(len(data),i+260)]:
                # stop at next func header after first few lines
                if l is not data[i] and "<func[" in l and re.search(r'<func\[\d+\]>',l):
                  break
                print(l.rstrip()[:2000])
          PY
