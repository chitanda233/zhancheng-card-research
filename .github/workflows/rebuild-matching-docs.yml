name: Rebuild research docs

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'README.md'
      - 'scripts/reconcile_report_sources.py'
      - 'scripts/systems_report_template.md'
      - 'scripts/build_systems_report.py'
      - 'scripts/build_battle_rules_report.py'
      - 'scripts/matching_report.md'
      - 'scripts/bot_ai_rules.md'
      - 'scripts/build_matching_report.py'
      - 'scripts/hex_random_report.md'
      - 'scripts/build_hex_random_report.py'
      - 'scripts/build_public_site.py'
      - 'tables/**'
      - '.github/workflows/rebuild-matching-docs.yml'

permissions:
  contents: write

concurrency:
  group: rebuild-research-docs
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check markdown pillow

      - name: Reconcile cross-report source conclusions
        run: python scripts/reconcile_report_sources.py

      - name: Rebuild system report
        run: python scripts/build_systems_report.py

      - name: Rebuild battle report
        run: python scripts/build_battle_rules_report.py

      - name: Rebuild matching report
        run: python scripts/build_matching_report.py

      - name: Rebuild hex randomness report
        run: python scripts/build_hex_random_report.py

      - name: Rebuild public docs
        run: python scripts/build_public_site.py

      - name: Validate generated reports
        shell: bash
        run: |
          test -s docs/reports/system/index.html
          test -s docs/reports/battle/index.html
          test -s docs/reports/matching/index.html
          test -s docs/reports/matching/bot.html
          test -s docs/reports/hex-random/index.html
          grep -q '目前没有证据表明周围格在“刚显现”那一刻重新掷一次25%' docs/reports/system/report.md
          grep -q '随机修正与保护：细节统一归地块随机专题' docs/reports/battle/report.md
          grep -q '共用该玩家一个局内消费位' docs/reports/battle/report.md
          grep -q '并共用该玩家一个局内消费位' docs/reports/matching/report.md
          grep -q '25%到底什么时候发生' docs/reports/hex-random/index.html
          grep -q '用户标签共用一次消费位' docs/reports/hex-random/index.html
          grep -q '新显现格通常是在揭晓开局生成结果' docs/reports/hex-random/index.html
          grep -q '匹配与机器人介入' docs/index.html
          ! grep -q '匹配与机器人完整配置' docs/index.html

      - name: Commit reconciled sources and generated files
        shell: bash
        run: |
          if git diff --quiet -- README.md scripts outputs/20260903 outputs/battle-rules outputs/matching outputs/hex-random docs; then
            echo 'No reconciled or generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md scripts outputs/20260903 outputs/battle-rules outputs/matching outputs/hex-random docs
          git commit -m 'docs: reconcile cross-report conclusions'
          git push
