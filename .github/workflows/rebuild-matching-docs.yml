name: Rebuild matching docs

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'scripts/matching_report.md'
      - 'scripts/bot_ai_rules.md'
      - 'scripts/build_matching_report.py'
      - 'scripts/build_public_site.py'
      - 'tables/**'
      - '.github/workflows/rebuild-matching-docs.yml'

permissions:
  contents: write

concurrency:
  group: rebuild-matching-docs
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check markdown pillow

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Rebuild matching report
        run: python scripts/build_matching_report.py

      - name: Rebuild public docs
        run: python scripts/build_public_site.py

      - name: Validate matching report
        run: node scripts/test_matching_report.cjs

      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet -- outputs/matching docs; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/matching docs
          git commit -m 'docs: rebuild matching report'
          git push
