name: Rebuild research docs

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'scripts/matching_report.md'
      - 'scripts/bot_ai_rules.md'
      - 'scripts/build_matching_report.py'
      - 'scripts/hex_random_report.md'
      - 'scripts/build_hex_random_report.py'
      - 'scripts/build_public_site.py'
      - 'tables/**'
      - '.github/workflows/rebuild-matching-docs.yml'

permissions:
  contents: write

concurrency:
  group: rebuild-research-docs
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check markdown pillow

      - name: Rebuild matching report
        run: python scripts/build_matching_report.py

      - name: Rebuild hex randomness report
        run: python scripts/build_hex_random_report.py

      - name: Rebuild public docs
        run: python scripts/build_public_site.py

      - name: Validate generated reports
        shell: bash
        run: |
          test -s docs/reports/matching/index.html
          test -s docs/reports/matching/bot.html
          test -s docs/reports/matching/report.md
          grep -q '2200 分' docs/reports/matching/index.html
          grep -q '第 5 次连续失败' docs/reports/matching/index.html
          grep -q '与机器人配置页的边界' docs/reports/matching/index.html
          grep -q '机器人配置详表' docs/reports/matching/index.html
          grep -q '机器人配置详表' docs/reports/matching/bot.html
          test -s docs/reports/hex-random/index.html
          test -s docs/reports/hex-random/report.md
          grep -q '25%到底什么时候发生' docs/reports/hex-random/index.html
          grep -q '用户标签共用一次消费位' docs/reports/hex-random/index.html
          grep -q '新显现格通常是在揭晓开局生成结果' docs/reports/hex-random/index.html

      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet -- outputs/matching outputs/hex-random docs; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/matching outputs/hex-random docs
          git commit -m 'docs: rebuild research reports'
          git push