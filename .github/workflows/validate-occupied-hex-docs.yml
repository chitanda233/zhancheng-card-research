name: Validate occupied hex report

on:
  push:
    branches:
      - research/occupied-hex-deep-dive
    paths:
      - 'scripts/hex_random_report.md'
      - 'scripts/build_hex_random_report.py'
      - '.github/workflows/validate-occupied-hex-docs.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/occupied-hex-deep-dive
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check markdown pillow
      - name: Rebuild hex report
        run: python scripts/build_hex_random_report.py
      - name: Publish public docs
        run: python scripts/build_public_site.py
      - name: Audit current docs baseline
        run: python scripts/audit_current_baseline.py --docs-only --output outputs/current-docs-audit.json
      - name: Validate occupied lifecycle content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('scripts/hex_random_report.md').read_text(encoding='utf-8')
          output = Path('outputs/hex-random/report.md').read_text(encoding='utf-8')
          report = Path('docs/reports/hex-random/report.md').read_text(encoding='utf-8')
          required = [
              '被占领隐藏格：价格档保留，内部稀有度与具体内容重抽',
              'TryRegenerateCapturedHiddenHexContent',
              'GetCapturedHiddenHexAvailableRareMask',
              '第二次生成保留第一层价格档，只重做后面的内部内容层',
              '76.92%',
              'ApplyHexOwnershipChangeIfNeeded',
          ]
          forbidden = [
              'SSSS',
              '当前尚未确认具体重抽哪几层',
              '究竟会重新抽25/50/100/250档位',
          ]
          for text in required:
              if text not in output:
                  raise SystemExit(f'MISSING FROM OUTPUT: {text}')
              if text not in report:
                  raise SystemExit(f'MISSING FROM PUBLISHED REPORT: {text}')
              print(f'OK required: {text}')
          for text in forbidden:
              if any(text in body for body in (source, output, report)):
                  raise SystemExit(f'FOUND FORBIDDEN TEXT: {text}')
              print(f'OK forbidden absent: {text}')
          if not Path('docs/reports/hex-random/index.html').stat().st_size:
              raise SystemExit('empty index.html')
          print('occupied lifecycle validation passed')
          PY
      - name: Commit generated hex report
        shell: bash
        run: |
          if git diff --quiet -- outputs/hex-random outputs/current-docs-audit.json docs/reports/hex-random; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/hex-random outputs/current-docs-audit.json docs/reports/hex-random
          git commit -m 'docs: rebuild occupied hex report'
          git push origin HEAD:research/occupied-hex-deep-dive
