name: Validate occupied hex report

on:
  push:
    branches:
      - research/occupied-hex-deep-dive
    paths:
      - 'scripts/hex_random_report.md'
      - 'scripts/build_hex_random_report.py'
      - '.github/workflows/validate-occupied-hex-docs.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/occupied-hex-deep-dive
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check markdown pillow
      - name: Rebuild hex report
        run: python scripts/build_hex_random_report.py
      - name: Audit and validate occupied lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_current_baseline.py --docs-only --output outputs/current-docs-audit.json
          test -s docs/reports/hex-random/index.html
          test -s docs/reports/hex-random/report.md
          grep -q '被占领隐藏格：价格档保留，内部稀有度与具体内容重抽' docs/reports/hex-random/report.md
          grep -q 'TryRegenerateCapturedHiddenHexContent' docs/reports/hex-random/report.md
          grep -q 'GetCapturedHiddenHexAvailableRareMask' docs/reports/hex-random/report.md
          grep -q '第二次生成保留第一层价格档，只重做后面的内部内容层' docs/reports/hex-random/report.md
          grep -q '76.92%' docs/reports/hex-random/report.md
          ! grep -q 'SSSS' scripts/hex_random_report.md
          ! grep -q 'SSSS' docs/reports/hex-random/report.md
          ! grep -q '当前尚未确认具体重抽哪几层' docs/reports/hex-random/report.md
          ! grep -q '究竟会重新抽25/50/100/250档位' docs/reports/hex-random/report.md
      - name: Commit generated hex report
        shell: bash
        run: |
          if git diff --quiet -- outputs/hex-random outputs/current-docs-audit.json docs/reports/hex-random; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/hex-random outputs/current-docs-audit.json docs/reports/hex-random
          git commit -m 'docs: rebuild occupied hex report'
          git push origin HEAD:research/occupied-hex-deep-dive
