name: Fix hex report cross references

on:
  push:
    branches:
      - refactor/hex-report-readability
    paths:
      - 'scripts/_tmp_fix_hex_crossrefs.py'
      - '.github/workflows/fix-hex-crossrefs.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/hex-report-readability
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check markdown pillow
      - name: Fix cross references
        run: python scripts/_tmp_fix_hex_crossrefs.py
      - name: Rebuild and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_hex_random_report.py
          python scripts/build_public_site.py
          python scripts/audit_current_baseline.py --docs-only --output outputs/current-docs-audit.json
          grep -q '因此5.2和5.3列出的' scripts/hex_random_report.md
          grep -q '第三层：初始化时选定并保存具体隐藏建筑' docs/reports/hex-random/report.md
          grep -q '卡组如何影响第三层候选' docs/reports/hex-random/report.md
      - name: Remove one-shot helpers
        run: rm -f scripts/_tmp_fix_hex_crossrefs.py .github/workflows/fix-hex-crossrefs.yml
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A scripts/hex_random_report.md outputs/hex-random docs/reports/hex-random outputs/current-docs-audit.json scripts/_tmp_fix_hex_crossrefs.py .github/workflows/fix-hex-crossrefs.yml
          git commit -m 'docs: fix hex report cross references'
          git push origin HEAD:refactor/hex-report-readability
