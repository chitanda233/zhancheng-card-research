name: Recover hex openable call chain

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-hex-openable.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install WABT
        run: |
          if ! command -v wasm-objdump >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y wabt
          fi

      - name: Recover exact target functions and direct callees
        shell: bash
        run: |
          set -euo pipefail
          OUT=outputs/hex-openable-reverse
          rm -rf "$OUT"
          mkdir -p "$OUT"
          DUMP='research/archive/2026-09-03/reverse-engineering/dump.cs'
          SRC='research/archive/2026-09-03/unpacked/_wasmcode_/wasmcode/8bb243383eca8b55.webgl.wasm.code.unityweb.wasm.br'
          WASM='/tmp/current.webgl.wasm'
          DIS='/tmp/current.objdump'

          {
            echo '# Target method contexts from dump.cs'
            echo
            for pat in \
              'CommitOpenedHex' \
              'ResolveOpenedHexOutcome' \
              'TryClaimAdjacentSpecialHexRewards' \
              'TryGetOfflinePveEnemyOpenableHexStates' \
              'CollectAuthoritativeOpenableEnemyHexes' \
              'ApplyBattleCoreAuthoritativeCellState' \
              'RefreshBattleCoreAuthoritativeCellPresentation' \
              'RefreshBattleCoreAuthoritativeHexPromptPresentation' \
              'RefreshBattleCoreAuthoritativeCellPresentationAfterBatch' \
              'MarkBattleCoreAuthoritativeVisibilityRefreshDirty' \
              'FlushBattleCoreAuthoritativeVisibilityRefreshBudgeted' \
              'GetHexOpenBlockReason' \
              'BattleHexCellState'; do
              echo "## $pat"
              grep -n -F -B 10 -A 28 "$pat" "$DUMP" | head -n 240 || true
              echo
            done
          } > "$OUT/dump-method-contexts.txt"

          node - "$SRC" "$WASM" <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const [src,dst] = process.argv.slice(2);
          const dec = zlib.brotliDecompressSync(fs.readFileSync(src));
          if (!(dec[0]===0 && dec[1]===0x61 && dec[2]===0x73 && dec[3]===0x6d)) throw new Error('not wasm');
          fs.writeFileSync(dst,dec);
          NODE

          cat > /tmp/map_elem.py <<'PY'
          import sys
          src,out=sys.argv[1:3]
          b=open(src,'rb').read(); assert b[:4]==b'\0asm'
          def uleb(p):
              v=s=0
              while True:
                  x=b[p]; p+=1; v|=(x&127)<<s
                  if x<128:return v,p
                  s+=7
          def sleb(p):
              v=s=0
              while True:
                  x=b[p]; p+=1; v|=(x&127)<<s; s+=7
                  if x<128:
                      if s<32 and x&64:v|=-(1<<s)
                      return v,p
          p=8; es=None
          while p<len(b):
              sid=b[p];p+=1; n,p=uleb(p); end=p+n
              if sid==9: es=p; break
              p=end
          assert es is not None
          p=es; segs,p=uleb(p); mapping={}; info=[]
          for si in range(segs):
              flags,p=uleb(p)
              if flags!=0: raise RuntimeError(f'unexpected element flags={flags} at segment {si}')
              if b[p]!=0x41: raise RuntimeError(f'unexpected offset opcode={b[p]:#x}')
              p+=1; offset,p=sleb(p)
              if b[p]!=0x0b: raise RuntimeError('offset expr missing end')
              p+=1; count,p=uleb(p); info.append((si,offset,count))
              for i in range(count):
                  fn,p=uleb(p); mapping[offset+i]=fn
          targets=[
            (0x4534,'BattleSimulation.OpenHex'),
            (0x459B,'BattleSimulation.CommitOpenedHex'),
            (0xF495,'BattleSimulation.ResolveOpenedHexOutcome'),
            (0xF497,'BattleSimulation.TryClaimAdjacentSpecialHexRewards'),
            (0xF498,'BattleSimulation.IsClaimableAdjacentSpecialHex'),
            (0x8F23,'TryGetOfflinePveEnemyOpenableHexStates'),
            (0x8DF4,'AIBehaviourManager.CollectAuthoritativeOpenableEnemyHexes'),
            (0x88FC,'HexBehaviour.ApplyBattleCoreAuthoritativeCellState'),
            (0x88FF,'HexBehaviour.RefreshBattleCoreAuthoritativeCellPresentation'),
            (0x8900,'HexBehaviour.RefreshBattleCoreAuthoritativeHexPromptPresentation'),
            (0x8918,'HexBehaviour.RefreshBattleCoreAuthoritativeCellPresentationAfterBatch'),
            (0x8919,'HexBehaviour.MarkBattleCoreAuthoritativeVisibilityRefreshDirty'),
            (0x891A,'HexBehaviour.FlushBattleCoreAuthoritativeVisibilityRefreshBudgeted')]
          with open(out,'w',encoding='utf-8') as f:
              f.write('# Element-table mapping for current matching build\n')
              f.write(f'segments={segs} info={info}\n\n')
              for idx,name in targets:f.write(f'0x{idx:04X}\t{idx}\tfunc[{mapping.get(idx)}]\t{name}\n')
              f.write('\n# validation\n')
              f.write(f'0x4534 expected=43532 actual={mapping.get(0x4534)}\n')
              f.write(f'0xF495 expected=25409 actual={mapping.get(0xF495)}\n')
          if mapping.get(0x4534)!=43532 or mapping.get(0xF495)!=25409: raise SystemExit('build mapping mismatch')
          PY
          python3 /tmp/map_elem.py "$WASM" "$OUT/table-target-map.txt"

          wasm-objdump -d "$WASM" > "$DIS"

          cat > /tmp/extract_objdump.py <<'PY'
          import re,sys
          dis,mapfile,out_targets,out_callees,out_graph=sys.argv[1:6]
          target_names={}
          for line in open(mapfile,encoding='utf-8'):
              m=re.search(r'func\[(\d+)\]\t(.+)$',line.rstrip())
              if m: target_names[int(m.group(1))]=m.group(2)
          targets=set(target_names)
          lines=open(dis,encoding='utf-8',errors='replace').readlines()
          chunks={}; cur=None; buf=[]
          def flush():
              if cur is not None: chunks[cur]=list(buf)
          for line in lines:
              m=re.search(r'func\[(\d+)\]',line)
              if m and line.rstrip().endswith(':'):
                  flush(); cur=int(m.group(1)); buf=[line]
              elif cur is not None:
                  buf.append(line)
          flush()
          with open(out_targets,'w',encoding='utf-8') as o:
              for fn in sorted(targets):
                  o.write(f'\n===== func[{fn}] {target_names.get(fn,"")} =====\n')
                  o.writelines(chunks.get(fn,[f'# missing func[{fn}]\n']))
          callees=set(); graph=[]
          for fn in sorted(targets):
              for line in chunks.get(fn,[]):
                  m=re.search(r'\bcall\s+(\d+)\b',line)
                  if m:
                      cal=int(m.group(1)); callees.add(cal); graph.append((fn,cal,line.strip()))
          with open(out_graph,'w',encoding='utf-8') as o:
              o.write('caller\tcallee\tinstruction\n')
              for a,b,s in graph:o.write(f'{a}\t{b}\t{s}\n')
          with open(out_callees,'w',encoding='utf-8') as o:
              for fn in sorted(callees):
                  o.write(f'\n===== func[{fn}] =====\n')
                  o.writelines(chunks.get(fn,[f'# missing func[{fn}]\n']))
          print('target_functions',len(targets),'direct_callees',len(callees),'call_edges',len(graph))
          PY

          python3 /tmp/extract_objdump.py "$DIS" "$OUT/table-target-map.txt" \
            "$OUT/target-functions.objdump" "$OUT/direct-callees.objdump" "$OUT/direct-callgraph.tsv" \
            > "$OUT/extraction-summary.txt"

          # Keep targeted text searches over exact functions/callees to speed manual review.
          grep -n -E 'i32\.load|i32\.store|call |br_if|i32\.const (0|1|2|3|4|5|6|25|50|100|250)' \
            "$OUT/target-functions.objdump" > "$OUT/target-instruction-hits.txt" || true

          {
            echo '# Source and validation'
            echo "$SRC"
            sha256sum "$SRC"
            echo "decompressed_size=$(stat -c%s "$WASM")"
            sha256sum "$WASM"
            cat "$OUT/extraction-summary.txt"
            echo "target_objdump_size=$(stat -c%s "$OUT/target-functions.objdump")"
            echo "callee_objdump_size=$(stat -c%s "$OUT/direct-callees.objdump")"
          } > "$OUT/source-build.txt"

          rm -f "$WASM" "$DIS"

      - name: Commit recovered diagnostics
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/hex-openable-reverse
          if ! git diff --cached --quiet; then
            git commit -m 'research: extract hex openable call graph'
            git push
          fi
