name: Patch all-SSSR hex report v2

on:
  push:
    branches:
      - docs/all-sssr-hex-fallback
    paths:
      - '.github/workflows/patch-all-sssr-hex-v2.yml'

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/all-sssr-hex-fallback
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check markdown pillow

      - name: Insert all-SSSR edge case
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/hex_random_report.md')
          s = p.read_text(encoding='utf-8')
          anchor = '### 2.4 三层随机不要混成一句“翻格随机”'
          assert anchor in s
          section = '''### 2.4 极端卡组：全 SSSR 时，50 / 100 低价格格可能最终仍翻出 SSSR

这里存在一个重要的牌组边界：**如果玩家的非空战斗牌组里只有 SSSR，50 / 100 普通兵营格的基础稀有度概率不会被改成100% SSSR，但最终点击结果可能因为候选为空后的回退路径而落到 SSSR。** 这不是第二层概率表失效，而是“第二层先抽稀有度、第三层找不到对应候选、点击阶段再回退选卡”叠加出来的结果。

以50金币一星格为例，初始化仍然先按74 / 20 / 5 / 1抽R / SR / SSR / SSSR；100金币二星格也仍然按50 / 40 / 8 / 2抽。假设50格先抽到R，而当前非空牌组全部是SSSR，`ResolveRandomArchitecture`会因为稀有度不匹配把这些SSSR候选过滤掉。当前链路显示，配置包卡池回退主要用于loadout缺失或卡组为空，不会因为“牌组非空但恰好没有本次目标稀有度”就自动补一张公共R卡，因此这个格子的初始化具体建筑可能没有匹配候选。

玩家之后真正点击时，`ResolveOpenedHexOutcome`会优先让`SelectCardForCellArchitecture`读取格子已有隐藏建筑；如果隐藏建筑缺失或无法映射到玩家本局拥有的卡，就回退到`SelectCardForHex(playerId, hexType)`。这个回退不再携带初始化阶段那次R / SR / SSR / SSSR抽取作为硬性稀有度限制，而是按当前格子类型从本局合法卡中选。于是，在这个格子类型下如果玩家所有合法候选都只有SSSR，最终就会选到SSSR。

```text
50 / 100普通兵营格
→ 初始化仍按原概率抽内部稀有度
→ 例如抽到R或SR
→ 全SSSR非空牌组没有对应稀有度候选
→ 初始化具体建筑候选为空 / 无法匹配
→ 玩家点击
→ SelectCardForCellArchitecture失败或无匹配
→ SelectCardForHex回退
→ 当前合法候选只有SSSR
→ 最终得到SSSR
```

前几次低价翻格还有一层保护，但它也不能凭空制造玩家没有的R卡。`TryApplyFirstThreeCheapOpenReroll`在价格低于250、已开低价格计数仍在保护范围、当前候选稀有度至少为SSR且不是资源/防御建筑等条件满足时，会调用`SelectFirstThreeRCardWithoutGoldMine(playerId)`尝试换成一张R卡。该选择器从玩家自己的战斗牌组寻找符合条件的R候选；如果全牌组都是SSSR，R候选为空，这次降级替换就无法成功，原来的SSSR结果会保留。

因此，在当前客户端链路下，可以把这个极端案例概括为：

|场景|初始化内部稀有度|第三层候选|点击阶段可能结果|
|---|---|---|---|
|50格抽到R / SR / SSR，牌组只有SSSR|仍按74 / 20 / 5 / 1正常抽|目标稀有度可能无候选|回退后可落到SSSR|
|100格抽到R / SR / SSR，牌组只有SSSR|仍按50 / 40 / 8 / 2正常抽|目标稀有度可能无候选|回退后可落到SSSR|
|50 / 100格本来就抽到SSSR|SSSR|有合法SSSR候选|正常选择SSSR|
|低价保护尝试把高稀有度降成R，但牌组没有R|—|R重抽池为空|降级失败，保留原结果|

这里有两个边界必须保留。第一，这个结论针对会进入普通兵营选卡链的格子，金矿、防御、特殊资源、教程强制格等不能直接套用。第二，必须存在符合当前`hexType`等限制的合法SSSR候选；“牌组全是SSSR”不等于任意格子都一定能找到合法SSSR。另一个容易误解的点是：**最终变成SSSR不会把地块价格同步改成250。50格仍是50，100格仍是100；改变的是最终卡牌结果，不是第一层价格档位。**

从设计角度看，这意味着极端牌组构成可能穿透50 / 100格原本的稀有度分布。基础权重表仍然真实参与初始化，但如果目标稀有度在玩家非空牌组中没有任何合法候选，后续回退会让玩家最终看到的分布显著偏离基础权重，因此分析实战出卡率时不能只看`GlobalHexInfo`四档概率表。

### 2.5 三层随机不要混成一句“翻格随机”'''
          s = s.replace(anchor, section, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Rebuild and validate HEX report
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_hex_random_report.py
          python scripts/build_public_site.py
          python scripts/audit_current_baseline.py --docs-only --output outputs/current-docs-audit.json
          grep -q '极端卡组：全 SSSR 时' docs/reports/hex-random/report.md
          grep -q 'SelectFirstThreeRCardWithoutGoldMine' docs/reports/hex-random/report.md
          grep -q '最终变成SSSR不会把地块价格同步改成250' docs/reports/hex-random/report.md
          grep -q '极端卡组：全 SSSR 时' docs/reports/hex-random/index.html

      - name: Commit generated report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-all-sssr-hex-v2.yml
          git add scripts/hex_random_report.md outputs/hex-random outputs/current-docs-audit.json docs
          git commit -m 'docs: document all-SSSR low-cost hex fallback'
          git push origin HEAD:docs/all-sssr-hex-fallback
