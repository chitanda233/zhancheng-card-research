name: Rebuild canonical reverse engineering

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebuild-canonical-reverse.yml'
      - 'research/archive/2026-09-03/unpacked/_wasmcode_/wasmcode/8bb243383eca8b55.webgl.wasm.code.unityweb.wasm.br'
      - 'research/archive/2026-09-03/reverse-engineering/dump.cs'
      - 'research/archive/2026-09-03/reverse-engineering/global-metadata.decrypted.dat'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install WABT
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y wabt
          wasm2wat --version
          wasm-objdump --version

      - name: Generate canonical reverse package
        shell: bash
        run: |
          set -euo pipefail
          ROOT='research/archive/2026-09-03/reverse-engineering'
          OUT="$ROOT/canonical"
          SRC='research/archive/2026-09-03/unpacked/_wasmcode_/wasmcode/8bb243383eca8b55.webgl.wasm.code.unityweb.wasm.br'
          META="$ROOT/global-metadata.decrypted.dat"
          DUMP="$ROOT/dump.cs"
          WASM='/tmp/canonical.webgl.wasm'
          WAT='/tmp/canonical.wat'
          OBJDUMP='/tmp/canonical.objdump'
          rm -rf "$OUT"
          mkdir -p "$OUT"

          node - "$SRC" "$WASM" <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const [src,dst] = process.argv.slice(2);
          const raw = fs.readFileSync(src);
          const dec = zlib.brotliDecompressSync(raw);
          if (!(dec[0]===0x00 && dec[1]===0x61 && dec[2]===0x73 && dec[3]===0x6d)) {
            throw new Error('canonical input did not decompress to a WASM module');
          }
          fs.writeFileSync(dst, dec);
          NODE

          wasm2wat "$WASM" -o "$WAT"
          wasm-objdump -d "$WASM" > "$OBJDUMP"
          wasm-objdump -x "$WASM" > "$OUT/module-info.txt"
          gzip -9 -c "$WAT" > "$OUT/module.wat.gz"
          gzip -9 -c "$OBJDUMP" > "$OUT/module.objdump.gz"

          python3 - "$WASM" "$DUMP" "$OUT" <<'PY'
          import csv, hashlib, json, re, sys
          from pathlib import Path

          wasm_path, dump_path, out_dir = map(Path, sys.argv[1:4])
          out_dir.mkdir(parents=True, exist_ok=True)
          b = wasm_path.read_bytes()
          assert b[:4] == b'\0asm'

          def uleb(p):
              v=s=0
              while True:
                  x=b[p]; p+=1; v|=(x&0x7f)<<s
                  if x < 0x80: return v,p
                  s += 7

          def sleb(p):
              v=s=0
              while True:
                  x=b[p]; p+=1; v|=(x&0x7f)<<s; s+=7
                  if x < 0x80:
                      if s < 64 and (x & 0x40): v |= -(1<<s)
                      return v,p

          p=8; element_start=None; element_end=None
          while p < len(b):
              sid=b[p]; p+=1
              n,p=uleb(p); end=p+n
              if sid == 9:
                  element_start, element_end = p, end
                  break
              p=end
          if element_start is None:
              raise SystemExit('no element section found')

          p=element_start
          segs,p=uleb(p)
          mapping={}
          segment_rows=[]
          for si in range(segs):
              flags,p=uleb(p)
              if flags != 0:
                  raise SystemExit(f'canonical build changed: unsupported element flags={flags} segment={si}')
              if b[p] != 0x41:
                  raise SystemExit(f'canonical build changed: unexpected offset opcode {b[p]:#x}')
              p+=1
              offset,p=sleb(p)
              if b[p] != 0x0b: raise SystemExit('element offset expression missing end opcode')
              p+=1
              count,p=uleb(p)
              segment_rows.append((si,offset,count))
              for i in range(count):
                  fn,p=uleb(p)
                  mapping[offset+i]=fn
          if p != element_end:
              raise SystemExit(f'element parser did not consume section exactly: {p} != {element_end}')

          with (out_dir/'element-map.tsv').open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f,delimiter='\t')
              w.writerow(['table_slot_hex','table_slot_dec','wasm_func'])
              for slot,fn in sorted(mapping.items()):
                  w.writerow([f'0x{slot:X}',slot,fn])

          lines=dump_path.read_text(encoding='utf-8',errors='replace').splitlines()
          rows=[]
          current_type=''
          current_namespace=''
          type_re=re.compile(r'^(?:(?:public|private|internal|protected|static|sealed|abstract|partial|readonly|ref)\s+)*(?:class|struct|interface|enum)\s+([^\s:{]+)')
          for i,line in enumerate(lines):
              s=line.strip()
              if s.startswith('// Namespace:'):
                  current_namespace=s.partition(':')[2].strip()
              tm=type_re.match(s)
              if tm: current_type=tm.group(1)
              m=re.search(r'RVA:\s*0x([0-9A-Fa-f]+)',line)
              if not m: continue
              rva=int(m.group(1),16)
              sig=''
              for j in range(i+1,min(i+8,len(lines))):
                  t=lines[j].strip()
                  if t and not t.startswith('//') and not t.startswith('['):
                      sig=t; break
              rows.append((rva,mapping.get(rva),i+1,current_namespace,current_type,sig))

          with (out_dir/'method-map.tsv').open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f,delimiter='\t')
              w.writerow(['rva_hex','rva_dec','wasm_func','dump_line','namespace','declaring_type_context','signature'])
              for rva,fn,ln,ns,typ,sig in rows:
                  w.writerow([f'0x{rva:X}',rva,'' if fn is None else fn,ln,ns,typ,sig])

          expected={
              0x4534:(43532,'OpenHex'),
              0x4597:(6642,'GetHexOpenBlockReason'),
              0x4598:(43468,'SpendGold'),
              0x459B:(25588,'CommitOpenedHex'),
              0xF495:(25409,'ResolveOpenedHexOutcome'),
              0xF61E:(25522,'HasPlayerOpenAnchorNeighbor'),
              0x42F2:(25926,'SetHexOpened'),
              0x4319:(11720,'MarkDynamicWallsDirtyAround'),
              0x88FC:(14763,'ApplyBattleCoreAuthoritativeCellState'),
          }
          signatures_by_rva={}
          for rva,fn,ln,ns,typ,sig in rows:
              signatures_by_rva.setdefault(rva,[]).append(sig)
          validation=[]
          ok=True
          for rva,(want_fn,want_name) in expected.items():
              actual=mapping.get(rva)
              sigs=signatures_by_rva.get(rva,[])
              name_ok=any(want_name in s for s in sigs)
              row_ok=(actual==want_fn and name_ok)
              validation.append({
                  'rva':f'0x{rva:X}','expected_func':want_fn,'actual_func':actual,
                  'expected_name':want_name,'matching_signatures':sigs,'ok':row_ok
              })
              ok &= row_ok
          with (out_dir/'validation.json').open('w',encoding='utf-8') as f:
              json.dump({'element_segments':segment_rows,'checks':validation,'all_ok':ok},f,ensure_ascii=False,indent=2)
          with (out_dir/'validation.txt').open('w',encoding='utf-8') as f:
              for x in validation:
                  f.write(f"{x['rva']}\tfunc[{x['actual_func']}]\t{x['expected_name']}\t{'OK' if x['ok'] else 'FAIL'}\n")
              f.write(f'ALL_OK={ok}\n')
          if not ok:
              raise SystemExit('canonical mapping validation failed; old reverse outputs will not be removed')
          PY

          # Keep any large compressed artifact below GitHub's hard file limit.
          for f in "$OUT/module.wat.gz" "$OUT/module.objdump.gz"; do
            size=$(stat -c%s "$f")
            if [ "$size" -ge 95000000 ]; then
              split -b 90m -d -a 3 "$f" "$f.part-"
              rm "$f"
            fi
          done

          python3 - "$SRC" "$WASM" "$META" "$DUMP" "$OUT" <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          src,wasm,meta,dump,out = map(Path,sys.argv[1:6])
          def info(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
              return {'path':str(p),'size':p.stat().st_size,'sha256':h.hexdigest()}
          generated=[]
          for p in sorted(out.iterdir()):
              if p.name in ('manifest.json','README.md'): continue
              generated.append(info(p))
          candidates=[]
          for p in sorted(Path('research/archive/2026-09-03/unpacked').rglob('*.wasm.br')):
              candidates.append({'path':str(p),'canonical':p==src,'size':p.stat().st_size})
          manifest={
              'schema_version':1,
              'canonical_input':info(src),
              'decompressed_wasm':info(wasm),
              'metadata_reference':info(meta),
              'dump_declaration_reference':info(dump),
              'other_raw_wasm_candidates':candidates,
              'tools':{
                  'wasm2wat':subprocess.check_output(['wasm2wat','--version'],text=True).strip(),
                  'wasm-objdump':subprocess.check_output(['wasm-objdump','--version'],text=True).strip(),
              },
              'generated':generated,
          }
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          cat > "$OUT/README.md" <<'EOF'
          # Canonical reverse-engineering package

          这是 2026-09-03 资源快照的唯一统一低层逆向产物。它固定使用：

          `research/archive/2026-09-03/unpacked/_wasmcode_/wasmcode/8bb243383eca8b55.webgl.wasm.code.unityweb.wasm.br`

          作为 canonical WASM 输入。仓库中 `_wasmcode1_` 等其他 cache 保留为原始资源，但属于另一套构建/布局，不允许和本目录的 RVA / func 映射混用。

          ## 文件职责

          - `module.wat.gz`：由当前 canonical WASM 通过 `wasm2wat` 全量生成的完整 WebAssembly 文本；若超过 GitHub 单文件限制，则保存为 `module.wat.gz.part-*`，按文件名顺序拼接即可恢复。
          - `module.objdump.gz`：由 `wasm-objdump -d` 全量生成的完整函数反汇编；超限时同样拆分。
          - `module-info.txt`：WASM 模块、Section、函数/表等结构信息。
          - `element-map.tsv`：完整的 table slot / RVA 槽位到 WASM function index 映射。
          - `method-map.tsv`：把现有 `dump.cs` 的 RVA、方法签名和本次 WASM function index 统一到一张表。
          - `validation.txt` / `validation.json`：已人工确认关键函数的硬校验。任一关键映射不一致，workflow 会失败，不会清理旧产物。
          - `manifest.json`：输入、metadata、dump.cs 和生成物的 SHA-256、大小和工具版本。

          ## 关于 dump.cs

          上级目录的 `dump.cs` 是项目此前已有的 IL2CPP 声明/元数据快照。本仓库没有保存生成它所用的 Il2CppDumper/Cpp2IL 工具链，所以本 workflow **不会声称重新生成了 C# 函数体**。它只把 `dump.cs` 当作声明与方法名参考，并通过 RVA 与本次完整 WASM 反汇编进行可验证映射。

          因此，今后应以本目录的 `module.wat(.gz)` / `module.objdump(.gz)` 作为“完整可重复生成的低层反编译/反汇编版本”，以 `method-map.tsv` 作为人类可读方法名入口；不要再新增按专题散落的 `.wat` / `.objdump` 版本。

          ## 重建

          使用 `.github/workflows/rebuild-canonical-reverse.yml`。该 workflow 只在 canonical 输入、metadata、dump.cs 或自身变化时自动重建，也可以手工运行。
          EOF
          sed -i 's/^          //' "$OUT/README.md"

          rm -f "$WASM" "$WAT" "$OBJDUMP"

      - name: Check old reverse output references
        shell: bash
        run: |
          set -euo pipefail
          # Historical output directories are going away. Abort rather than leave a live code/doc reference dangling.
          refs=$(grep -R -n -E 'outputs/(chest-reverse|hex-openable-reverse)' . \
            --exclude-dir=.git \
            --exclude-dir=chest-reverse \
            --exclude-dir=hex-openable-reverse \
            --exclude='rebuild-canonical-reverse.yml' || true)
          if [ -n "$refs" ]; then
            printf '%s\n' "$refs"
            echo 'Found live references to obsolete reverse directories; update them before cleanup.' >&2
            exit 1
          fi

      - name: Remove obsolete topic-specific reverse outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf outputs/chest-reverse outputs/hex-openable-reverse
          git rm --ignore-unmatch .github/workflows/recover-hex-openable.yml

      - name: Validate canonical package
        shell: bash
        run: |
          set -euo pipefail
          OUT='research/archive/2026-09-03/reverse-engineering/canonical'
          test -s "$OUT/README.md"
          test -s "$OUT/manifest.json"
          test -s "$OUT/module-info.txt"
          test -s "$OUT/element-map.tsv"
          test -s "$OUT/method-map.tsv"
          test -s "$OUT/validation.txt"
          grep -q '0x4534.*func\[43532\].*OpenHex.*OK' "$OUT/validation.txt"
          grep -q '0x459B.*func\[25588\].*CommitOpenedHex.*OK' "$OUT/validation.txt"
          grep -q '0xF495.*func\[25409\].*ResolveOpenedHexOutcome.*OK' "$OUT/validation.txt"
          grep -q '0xF61E.*func\[25522\].*HasPlayerOpenAnchorNeighbor.*OK' "$OUT/validation.txt"
          grep -q 'ALL_OK=True' "$OUT/validation.txt"
          find "$OUT" -maxdepth 1 \( -name 'module.wat.gz' -o -name 'module.wat.gz.part-*' \) | grep -q .
          find "$OUT" -maxdepth 1 \( -name 'module.objdump.gz' -o -name 'module.objdump.gz.part-*' \) | grep -q .
          test ! -e outputs/chest-reverse
          test ! -e outputs/hex-openable-reverse
          test ! -e .github/workflows/recover-hex-openable.yml

      - name: Commit canonical package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/archive/2026-09-03/reverse-engineering/canonical .github/workflows outputs
          if ! git diff --cached --quiet; then
            git commit -m 'research: consolidate canonical reverse engineering package'
            git push
          fi
