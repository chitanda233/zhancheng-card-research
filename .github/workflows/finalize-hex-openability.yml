name: Finalize hex openability research

on:
  push:
    paths:
      - '.github/workflows/finalize-hex-openability.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch reviewed report source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('scripts/hex_random_report.md')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '研究日期：2026-09-08；2026-09-10 复核“新显现格子”和 SSSR 标签加权链。',
              '研究日期：2026-09-08；2026-09-10 复核“新显现格子、开放锚点”和 SSSR 标签加权链。'
          )
          text = text.replace(
              '→ 玩家扩张时周围格子进入可见/可开启状态\n→ 玩家点击时读取既有隐藏结果，再执行少量重抽、引导和保底覆盖',
              '→ 玩家打开边界格后，邻格因新增 opened anchor 满足当前开放条件并在表现层显现\n→ 玩家点击目标格时读取既有隐藏结果，再执行少量重抽、引导和保底覆盖'
          )

          new_section = r'''### 2.5 剩余普通格才等概率抽地块档位：25%到底什么时候发生

没有固定用途的普通格在`ResolveInitialRarity`中执行：

```text
quality = Range(0,4)
```

四个整数等概率，因此这一层是各25%。随后档位直接映射到外观和基础价格：

|Quality|玩家看到的地块|基础价格|普通格第一层概率|
|---:|---|---:|---:|
|0|一星|50|25%|
|1|二星|100|25%|
|2|三星|250|25%|
|3|问号|25|25%|

这些25%只适用于走到普通档位随机的格子，不是整张地图的最终占比。主城邻格、金矿、防御、模板固定格和特殊资源都已在前面改变了构成。

更重要的是这25%的**发生时点**。本次把初始化、开格校验、真正提交开格和邻接判定重新映射到同一份WASM后，函数链已经可以明确写成：

```text
初始化：BuildInitialSetupNormalized
→ BuildStableGenerationOrder
→ BuildCellContent
→ ResolveInitialRarity
→ 普通格 Range(0,4)，确定一星 / 二星 / 三星 / 问号
→ 隐藏结果写入 BattleHexCellState

玩家点击目标格：OpenHex（RVA 0x4534 / func[43532]）
→ GetHexOpenBlockReason（RVA 0x4597 / func[6642]）
→ SpendGold（RVA 0x4598 / func[43468]）
→ CommitOpenedHex（RVA 0x459B / func[25588]）
→ ResolveOpenedHexOutcome（RVA 0xF495 / func[25409]）
```

这里也修正旧版报告的一处命名错误：`func[25409]`不是`OpenHex`本体，而是`ResolveOpenedHexOutcome`；真正接收玩家开格动作的`OpenHex`是`func[43532]`，真正提交状态的`CommitOpenedHex`是`func[25588]`。

#### 2.5.1 `CanOpen`不是“刚显现时重新随机”的标志

恢复出的`BattleHexCellState`字段布局已经确认：

|字段|偏移|含义|
|---|---:|---|
|`IsEnemyHex`|0x22|格子属于哪一侧|
|`IsOpened`|0x23|是否已经打开|
|`CanOpen`|0x24|该格是否具备基础开放许可|
|`IsBridge`|0x25|是否桥格|
|`IsPlayerMainTower`|0x26|是否玩家主城|
|`IsEnemyMainTower`|0x27|是否敌方主城|

`GetHexOpenBlockReason`会直接读取`CanOpen`，但**不会只靠这个字段决定当前能否点击**。在基础状态、主城/桥格等条件通过后，它还会调用：

```text
HasPlayerOpenAnchorNeighbor(int playerId, BattleHexCellState target)
RVA 0xF61E / func[25522]
```

该函数会遍历目标格的`Neighbors`，逐个读取 authoritative `BattleHexCellState`，并检查邻格的`IsEnemyHex`、`IsOpened`、`IsPlayerMainTower`和`IsEnemyMainTower`等状态，以判断目标格旁边是否存在属于该玩家的有效“已开放锚点”。因此当前证据更支持：`CanOpen`是基础许可，而“现在是否已经扩张到这个格子”由邻接锚点条件进一步决定。

这解释了玩家看到的典型过程：

```text
开局内部：B、C、D的档位和隐藏内容已经生成
A尚未打开时：B/C/D即使CanOpen允许，也可能因为没有本方opened anchor而不能操作
玩家打开A
→ A的IsOpened变为true
→ B/C/D再次经过HasPlayerOpenAnchorNeighbor时可以命中A这个开放锚点
→ 它们满足当前开放条件
→ authoritative状态同步到表现层
→ UI显示价格、图标或可操作提示
```

因此，“打开A以后出现B/C/D”与“系统此时重新给B/C/D各掷一次25%”是两件不同的事。当前函数级证据支持前者，不支持后者。

#### 2.5.2 开格提交阶段也没有重新执行四档随机

`CommitOpenedHex`会先确认目标格尚未`IsOpened`，随后进入`ResolveOpenedHexOutcome`处理已经存在的格子结果；需要时再调用`TryClaimAdjacentSpecialHexRewards`一类特殊资源逻辑，并通过`MarkDynamicWallsDirtyAround`刷新动态墙拓扑。动态墙刷新和邻接特殊奖励都属于开格后的独立阶段，不是普通地块档位生成。

同时，`BattleNavigationSystem.SetHexOpened(BattleHexCoord,bool)`负责切换导航/核心状态中的opened状态并标记后续刷新。已经恢复的开格主链中没有出现决定普通四档的`Range(0,4)`再次调用。因此目前可以把结论提高到：**普通格的一星/二星/三星/问号档位在初始化阶段生成；玩家扩张后发生的是开放条件变化和表现层揭示，而不是档位二次生成。**

仍需保留的证据边界是：目前没有线上实包证明服务器不会在特定实验模式下覆盖客户端初始化结果；而且UI层从 authoritative cell state 到具体动画/显隐组件的全部调用顺序尚未逐函数恢复。但这两个边界都不影响当前客户端1.4.15.558-preview主链中“25%档位随机发生在初始化而不是邻格显现时”的结论。

### 2.6 地块档位再决定内部稀有度：SSSR加权与一次性消费'''

          pattern = r'### 2\.5 剩余普通格才等概率抽地块档位：25%到底什么时候发生\n.*?\n### 2\.6 地块档位再决定内部稀有度：SSSR加权与一次性消费'
          text2, count = re.subn(pattern, new_section, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'failed to replace section 2.5, matches={count}')

          # Remove stale phrasing if it exists anywhere else in the reviewed source.
          text2 = text2.replace('实际开格函数`25409`', '`ResolveOpenedHexOutcome`（func[25409]）')
          path.write_text(text2, encoding='utf-8')
          PY

      - name: Install report dependencies
        run: python -m pip install --quiet markdown pillow

      - name: Rebuild hex report and public site
        run: |
          set -euo pipefail
          python scripts/build_hex_random_report.py
          python scripts/build_public_site.py

      - name: Validate published content
        run: |
          set -euo pipefail
          test -s outputs/hex-random/index.html
          test -s outputs/hex-random/report.md
          test -s docs/reports/hex-random/index.html
          test -s docs/reports/hex-random/report.md
          grep -q 'HasPlayerOpenAnchorNeighbor' outputs/hex-random/index.html
          grep -q 'func\[43532\]' outputs/hex-random/index.html
          grep -q 'func\[25588\]' outputs/hex-random/index.html
          grep -q '不是档位二次生成' outputs/hex-random/index.html
          grep -q 'HasPlayerOpenAnchorNeighbor' docs/reports/hex-random/index.html

      - name: Remove one-shot diagnostics
        run: |
          rm -f outputs/hex-openable-reverse/canopen-writers.txt
          git rm --ignore-unmatch \
            .github/workflows/lookup-hex-rva-context.yml \
            .github/workflows/find-canopen-writers.yml \
            .github/workflows/finalize-hex-openability.yml

      - name: Commit final report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/hex_random_report.md outputs/hex-random docs outputs/hex-openable-reverse
          if ! git diff --cached --quiet; then
            git commit -m 'docs: finalize hex reveal and open-anchor analysis'
            git push
          fi
