name: Trace CanOpen writers

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/find-canopen-writers.yml'

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Summarize candidate writers by owning type
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          raw=Path('outputs/hex-openable-reverse/canopen-writers.txt').read_text(encoding='utf-8',errors='replace')
          dump=Path('research/archive/2026-09-03/reverse-engineering/dump.cs').read_text(encoding='utf-8',errors='replace').splitlines()
          # RVA -> (line, signature, approximate enclosing type)
          meta={}
          current_type=''
          type_re=re.compile(r'^(?:public|private|internal|protected|static|sealed|abstract|partial|\s)*(?:sealed\s+|abstract\s+|static\s+)?(?:class|struct|interface)\s+([^\s:{]+)')
          for i,line in enumerate(dump):
              t=line.strip()
              tm=type_re.match(t)
              if tm: current_type=tm.group(1)
              m=re.search(r'RVA:\s*0x([0-9A-Fa-f]+)',line)
              if not m: continue
              rva=int(m.group(1),16); sig=''
              for j in range(i+1,min(i+6,len(dump))):
                  x=dump[j].strip()
                  if x and not x.startswith('//') and not x.startswith('['): sig=x; break
              meta[rva]=(i+1,sig,current_type)

          sections=re.split(r'(?=^===== func\[)',raw,flags=re.M)
          all_rows=[]; likely=[]
          for sec in sections:
              hm=re.match(r'===== func\[(\d+)\] rvas=([^=]*) =====',sec)
              if not hm: continue
              fn=int(hm.group(1)); rvas=[]
              for tok in hm.group(2).split(','):
                  tok=tok.strip()
                  if tok:
                      try:rvas.append(int(tok,16))
                      except:pass
              named=[]
              for rva in rvas:
                  if rva in meta: named.append((rva,*meta[rva]))
              if not named: continue
              all_rows.append((fn,named))
              text=' '.join([x[3]+' '+x[2] for x in named]).lower()
              if any(k in text for k in ['battlesimulation','battlehex','hexcell','openhex','openable','canopen','initialsetup','cellcontent','setupbuilder','battlemap']):
                  likely.append((fn,named))

          out=Path('outputs/hex-openable-reverse/canopen-writer-summary.txt')
          with out.open('w',encoding='utf-8') as f:
              f.write('# Candidate offset-0x24 byte writers mapped back to dump.cs\n')
              f.write(f'named_writer_functions={len(all_rows)} likely_hex_writer_functions={len(likely)}\n\n')
              f.write('## Likely hex / battle candidates\n')
              for fn,named in likely:
                  f.write(f'func[{fn}]\n')
                  for rva,ln,sig,typ in named:
                      f.write(f'  0x{rva:X}\tline {ln}\ttype={typ}\t{sig}\n')
              f.write('\n## All named candidates\n')
              for fn,named in all_rows:
                  f.write(f'func[{fn}]\n')
                  for rva,ln,sig,typ in named:
                      f.write(f'  0x{rva:X}\tline {ln}\ttype={typ}\t{sig}\n')
          print('named',len(all_rows),'likely',len(likely))
          PY
      - name: Commit summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/hex-openable-reverse/canopen-writer-summary.txt
          if ! git diff --cached --quiet; then
            git commit -m 'research: summarize CanOpen writer candidates'
            git push
          fi
