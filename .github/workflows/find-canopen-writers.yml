name: Trace CanOpen writers

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/find-canopen-writers.yml'

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Isolate open-anchor helper bodies
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          src=Path('outputs/hex-openable-reverse/openable-gate.objdump').read_text(encoding='utf-8',errors='replace')
          wanted=[25522,25926,6642,11720]
          for fn in wanted:
              m=re.search(rf'(?ms)^===== func\[{fn}\] =====\n(.*?)(?=^===== func\[|\Z)',src)
              body=m.group(0) if m else f'# func[{fn}] not found\n'
              Path(f'outputs/hex-openable-reverse/func-{fn}.objdump').write_text(body,encoding='utf-8')
          PY
      - name: Commit isolated bodies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/hex-openable-reverse/func-*.objdump
          if ! git diff --cached --quiet; then
            git commit -m 'research: isolate open-anchor helper bodies'
            git push
          fi
