name: Analyze occupied hex regeneration

on:
  push:
    branches:
      - research/occupied-hex-deep-dive
    paths:
      - '.github/workflows/analyze-occupied-hex.yml'

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/occupied-hex-deep-dive
          fetch-depth: 1
      - name: Find occupied hex callers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,gzip,re
          mm=Path('research/archive/2026-09-11/reverse-engineering/canonical/method-map.tsv')
          objp=Path('research/archive/2026-09-11/reverse-engineering/canonical/module.objdump.gz')
          by_func={}
          with mm.open(encoding='utf-8',newline='') as f:
            for r in csv.DictReader(f,delimiter='\t'):
              by_func.setdefault(int(r['wasm_func']),[]).append(r)
          obj=gzip.open(objp,'rt',encoding='utf-8',errors='replace').read()
          starts=[(m.start(),int(m.group(1))) for m in re.finditer(r'(?m)^.*func\[([0-9]+)\].*$',obj)]
          def desc(fn):
            return ' || '.join(f"{r['rva_hex']} {r['declaring_type_context']}.{r['signature']}" for r in by_func.get(fn,[])[:10])
          targets=[25323,43533,25286,25409]
          out=['# Occupied hex callers']
          for target in targets:
            out += ['',f'## callers of func[{target}] {desc(target)}']
            pat=re.compile(r'\bcall\s+'+str(target)+r'\b')
            for i,(a,fn) in enumerate(starts):
              b=starts[i+1][0] if i+1<len(starts) else len(obj)
              body=obj[a:b]
              if pat.search(body):
                out.append(f'caller func[{fn}] {desc(fn)}')
                for line in body.splitlines():
                  if pat.search(line): out.append('  '+line.strip())
          p=Path('outputs/occupied-hex-callers.txt');p.write_text('\n'.join(out),encoding='utf-8');print(p.read_text())
          PY
      - name: Commit analysis output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/occupied-hex-callers.txt
          git commit -m 'research: locate occupied hex regeneration callers'
          git push origin HEAD:research/occupied-hex-deep-dive
