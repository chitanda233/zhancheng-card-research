name: Analyze occupied hex regeneration

on:
  push:
    branches:
      - research/occupied-hex-deep-dive
    paths:
      - '.github/workflows/analyze-occupied-hex.yml'

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/occupied-hex-deep-dive
          fetch-depth: 1
      - name: Extract occupied hex evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, gzip, re

          root = Path('.')
          mm = root/'research/archive/2026-09-11/reverse-engineering/canonical/method-map.tsv'
          wat_gz = root/'research/archive/2026-09-11/reverse-engineering/canonical/module.wat.gz'
          dump = root/'research/archive/2026-09-11/reverse-engineering/csharp/dump.cs'

          rows=[]
          by_func={}
          with mm.open(encoding='utf-8', newline='') as f:
              for r in csv.DictReader(f, delimiter='\t'):
                  rows.append(r)
                  by_func.setdefault(int(r['wasm_func']), []).append(r)

          target_rvas = {f'0x{v:X}' for v in range(0xF366,0xF374)} | {'0x42EE','0xF495'}
          targets=[]
          for r in rows:
              if r['rva_hex'].upper() in {x.upper() for x in target_rvas}:
                  targets.append(r)
          targets.sort(key=lambda r:int(r['rva_dec']))
          target_funcs=sorted({int(r['wasm_func']) for r in targets})

          wat = gzip.open(wat_gz,'rt',encoding='utf-8',errors='replace').read()
          starts=[(m.start(), int(m.group(1))) for m in re.finditer(r'(?m)^\s*\(func \(;([0-9]+);\)', wat)]
          pos={fn:i for i,(off,fn) in enumerate(starts)}
          def body(fn):
              i=pos.get(fn)
              if i is None: return ''
              a=starts[i][0]
              b=starts[i+1][0] if i+1<len(starts) else len(wat)
              return wat[a:b]
          def sigs(fn):
              return ['%s %s.%s %s'%(r['rva_hex'],r['namespace'],r['declaring_type_context'],r['signature']) for r in by_func.get(fn,[])]

          out=[]
          out.append('# Occupied hex deep dive\n')
          out.append('## Target method map\n')
          for r in targets:
              out.append(f"{r['rva_hex']} -> func[{r['wasm_func']}] :: {r['signature']}")

          out.append('\n## Direct calls from target functions\n')
          all_called=set()
          for fn in target_funcs:
              b=body(fn)
              calls=[int(x) for x in re.findall(r'\bcall\s+([0-9]+)\b', b)]
              all_called.update(calls)
              out.append(f'\n### func[{fn}]')
              out.extend(sigs(fn) or ['(no method-map signature)'])
              for c in calls:
                  ss=sigs(c)
                  if ss:
                      out.append(f'call {c} -> ' + ' || '.join(ss[:4]))
                  else:
                      out.append(f'call {c}')

          out.append('\n## Relevant type declarations\n')
          lines=dump.read_text(encoding='utf-8',errors='replace').splitlines()
          needles=['CapturedHiddenHexCardCandidate','CapturedHiddenHexCandidateSlice','CapturedHiddenHexCandidateCacheKind','BattleHexCellState']
          seen=set()
          for i,line in enumerate(lines):
              if any(n in line for n in needles) and ('class ' in line or 'struct ' in line or 'enum ' in line):
                  key=(i,line)
                  if key in seen: continue
                  seen.add(key)
                  out.append(f'\n### dump.cs around line {i+1}: {line.strip()}')
                  out.extend(lines[max(0,i-8):min(len(lines),i+90)])

          out.append('\n## WAT bodies\n')
          for fn in target_funcs:
              out.append(f'\n### func[{fn}] ' + ' || '.join(sigs(fn)))
              out.append(body(fn))

          Path('outputs/occupied-hex-deep-dive.txt').write_text('\n'.join(out),encoding='utf-8')
          print('targets', target_funcs)
          print('output bytes', Path('outputs/occupied-hex-deep-dive.txt').stat().st_size)
          PY
      - name: Commit analysis output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/occupied-hex-deep-dive.txt
          git commit -m 'research: extract occupied hex regeneration evidence'
          git push origin HEAD:research/occupied-hex-deep-dive
