name: Patch canonical dump audit once

on:
  push:
    paths:
      - '.github/workflows/patch-canonical-dump-audit-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden dump.cs parsing and add audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/rebuild-canonical-reverse.yml')
          s=p.read_text(encoding='utf-8')

          old="""              m=re.search(r'RVA:\\s*0x([0-9A-Fa-f]+)',line)\n              if not m: continue\n              rva=int(m.group(1),16)\n"""
          new="""              # Only canonical method-header RVAs are safe to attribute directly.\n              # GenericInstMethod blocks contain secondary `|-RVA:` comments whose\n              # following text is not the owning method signature. Keep those out\n              # of method-map.tsv and count them separately in dump-audit.json.\n              m=re.match(r'^\\s*// RVA:\\s*0x([0-9A-Fa-f]+)',line)\n              if not m: continue\n              rva=int(m.group(1),16)\n"""
          if old not in s:
              raise SystemExit('primary RVA parser block not found')
          s=s.replace(old,new,1)

          marker="""          with (out_dir/'method-map.tsv').open('w',encoding='utf-8',newline='') as f:\n              w=csv.writer(f,delimiter='\\t')\n              w.writerow(['rva_hex','rva_dec','wasm_func','dump_line','namespace','declaring_type_context','signature'])\n              for rva,fn,ln,ns,typ,sig in rows:\n                  w.writerow([f'0x{rva:X}',rva,'' if fn is None else fn,ln,ns,typ,sig])\n\n"""
          audit="""          with (out_dir/'method-map.tsv').open('w',encoding='utf-8',newline='') as f:\n              w=csv.writer(f,delimiter='\\t')\n              w.writerow(['rva_hex','rva_dec','wasm_func','dump_line','namespace','declaring_type_context','signature'])\n              for rva,fn,ln,ns,typ,sig in rows:\n                  w.writerow([f'0x{rva:X}',rva,'' if fn is None else fn,ln,ns,typ,sig])\n\n          generic_inst_refs=[]\n          for i,line in enumerate(lines):\n              gm=re.search(r'\\|-RVA:\\s*0x([0-9A-Fa-f]+)',line)\n              if gm:\n                  generic_inst_refs.append((int(gm.group(1),16),i+1))\n          by_rva={}\n          for r in rows:\n              by_rva.setdefault(r[0],[]).append(r)\n          duplicate_primary={f'0x{k:X}':len(v) for k,v in by_rva.items() if len(v)>1}\n          mapped=sum(1 for r in rows if r[1] is not None)\n          audit={\n              'dump_total_lines':len(lines),\n              'primary_method_rva_rows':len(rows),\n              'primary_method_rva_unique':len(by_rva),\n              'primary_method_rva_mapped_to_canonical_wasm':mapped,\n              'primary_method_rva_unmapped':len(rows)-mapped,\n              'generic_instantiation_rva_comment_refs_excluded':len(generic_inst_refs),\n              'duplicate_primary_rva_count':len(duplicate_primary),\n              'duplicate_primary_rvas':duplicate_primary,\n              'policy':[\n                  'dump.cs is a declaration/name/layout reference, not executable behavior or recovered C# bodies',\n                  'method-map.tsv includes only top-level method header lines beginning with // RVA: 0x',\n                  'GenericInstMethod |-RVA comments are excluded from direct signature attribution',\n                  'behavior claims must be confirmed against canonical module.wat/module.objdump',\n              ],\n          }\n          (out_dir/'dump-audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')\n\n"""
          if marker not in s:
              raise SystemExit('method-map output block not found')
          s=s.replace(marker,audit,1)

          old_readme="""          - `method-map.tsv`：把现有 `dump.cs` 的 RVA、方法签名和本次 WASM function index 统一到一张表。\n          - `validation.txt` / `validation.json`：已人工确认关键函数的硬校验。任一关键映射不一致，workflow 会失败，不会清理旧产物。\n"""
          new_readme="""          - `method-map.tsv`：只读取 `dump.cs` 方法头部的 `// RVA: 0x...`，把主方法 RVA、方法签名和本次 WASM function index 统一到一张表；`GenericInstMethod` 注释里的 `|-RVA:` 不会被当成独立方法签名。\n          - `dump-audit.json`：记录 `dump.cs` 总行数、主 RVA、泛型实例 RVA 注释、映射覆盖与重复 RVA，作为使用 `dump.cs` 前的风险审计。\n          - `validation.txt` / `validation.json`：已人工确认关键函数的硬校验。任一关键映射不一致，workflow 会失败，不会清理旧产物。\n"""
          if old_readme not in s:
              raise SystemExit('README file-duty block not found')
          s=s.replace(old_readme,new_readme,1)

          old_about="""          上级目录的 `dump.cs` 是项目此前已有的 IL2CPP 声明/元数据快照。本仓库没有保存生成它所用的 Il2CppDumper/Cpp2IL 工具链，所以本 workflow **不会声称重新生成了 C# 函数体**。它只把 `dump.cs` 当作声明与方法名参考，并通过 RVA 与本次完整 WASM 反汇编进行可验证映射。\n"""
          new_about="""          上级目录的 `dump.cs` 是项目此前已有的 IL2CPP 声明/元数据快照。本仓库没有保存生成它所用的 Il2CppDumper/Cpp2IL 工具链，所以本 workflow **不会声称重新生成了 C# 函数体**。其中的 `{ }` 方法体不表示真实逻辑，`RVA: -1`、泛型共享/实例化 RVA、字段偏移也必须按 IL2CPP dump 语义理解。它只作为类型、字段、方法名和主 RVA 的候选参考；任何行为结论都必须回到本次 canonical WASM 反汇编验证。\n"""
          if old_about not in s:
              raise SystemExit('README dump.cs warning block not found')
          s=s.replace(old_about,new_about,1)

          old_validate='''          test -s "$OUT/method-map.tsv"\n          test -s "$OUT/validation.txt"\n'''
          new_validate='''          test -s "$OUT/method-map.tsv"\n          test -s "$OUT/dump-audit.json"\n          test -s "$OUT/validation.txt"\n          grep -q 'generic_instantiation_rva_comment_refs_excluded' "$OUT/dump-audit.json"\n'''
          if old_validate not in s:
              raise SystemExit('validation block not found')
          s=s.replace(old_validate,new_validate,1)

          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/rebuild-canonical-reverse.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rebuild-canonical-reverse.yml
          git commit -m 'research: harden dump.cs method mapping'
          git push
