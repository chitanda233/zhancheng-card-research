name: Analyze OpenHex captured path
on:
  push:
    branches: [research/occupied-hex-deep-dive]
    paths: ['.github/workflows/analyze-openhex-caller.yml']
permissions:
  contents: write
jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/occupied-hex-deep-dive
          fetch-depth: 1
      - name: Extract ownership and captured regeneration path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,gzip,re
          mm=Path('research/archive/2026-09-11/reverse-engineering/canonical/method-map.tsv')
          by_func={}
          with mm.open(encoding='utf-8',newline='') as f:
            for r in csv.DictReader(f,delimiter='\t'): by_func.setdefault(int(r['wasm_func']),[]).append(r)
          obj=gzip.open('research/archive/2026-09-11/reverse-engineering/canonical/module.objdump.gz','rt',encoding='utf-8',errors='replace').read()
          entries=[(m.start(),int(m.group(1))) for m in re.finditer(r'(?m)^.*func\[([0-9]+)\].*$',obj)]
          pos={fn:i for i,(_,fn) in enumerate(entries)}
          def body(fn):
            i=pos[fn];a=entries[i][0];b=entries[i+1][0] if i+1<len(entries) else len(obj);return obj[a:b]
          def desc(fn):return ' || '.join(f"{r['rva_hex']} {r['declaring_type_context']}.{r['signature']}" for r in by_func.get(fn,[])[:8])
          out=['# Ownership captured path']
          for fn in [43484,43600,25323,43532,25588,25409]:
            if fn in pos: out += ['',f'## func[{fn}] {desc(fn)}',body(fn)]
          for target in [43600,25323]:
            out += ['',f'## callers of func[{target}] {desc(target)}']
            needle=f'call {target} '
            for i,(a,fn) in enumerate(entries):
              b=entries[i+1][0] if i+1<len(entries) else len(obj);chunk=obj[a:b]
              if needle in chunk:
                out.append(f'caller func[{fn}] {desc(fn)}')
                out.extend('  '+ln.strip() for ln in chunk.splitlines() if needle in ln)
          p=Path('outputs/ownership-captured-path.txt');p.write_text('\n'.join(out),encoding='utf-8');print('\n'.join(out[-40:]))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/ownership-captured-path.txt
          git commit -m 'research: trace ownership captured path'
          git push origin HEAD:research/occupied-hex-deep-dive
