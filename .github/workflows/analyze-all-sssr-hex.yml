name: Analyze all-SSSR deck hex fallback

on:
  push:
    branches:
      - research/all-sssr-deck-hex
    paths:
      - '.github/workflows/analyze-all-sssr-hex.yml'

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/all-sssr-deck-hex
          fetch-depth: 1
      - name: Extract key fallback functions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, gzip, re

          mm = Path('research/archive/2026-09-11/reverse-engineering/canonical/method-map.tsv')
          objp = Path('research/archive/2026-09-11/reverse-engineering/canonical/module.objdump.gz')
          rows=[]; by_func={}
          with mm.open(encoding='utf-8', newline='') as f:
              for r in csv.DictReader(f, delimiter='\t'):
                  rows.append(r)
                  try: by_func.setdefault(int(r['wasm_func']), []).append(r)
                  except Exception: pass
          obj=gzip.open(objp,'rt',encoding='utf-8',errors='replace').read()
          starts=[(m.start(),int(m.group(1))) for m in re.finditer(r'(?m)^.*func\[([0-9]+)\].*$',obj)]
          pos={fn:i for i,(_,fn) in enumerate(starts)}
          def body(fn):
              i=pos[fn];a=starts[i][0];b=starts[i+1][0] if i+1<len(starts) else len(obj);return obj[a:b]
          def desc(fn):
              rs=by_func.get(fn,[])
              return ' || '.join(f"{r.get('rva_hex','')} {r.get('declaring_type_context','')}.{r.get('signature','')}" for r in rs[:8]) or '(no method-map name)'
          def annotate(text):
              def repl(m):
                  fn=int(m.group(1)); return m.group(0)+'    ;; '+desc(fn)
              return re.sub(r'(?m)^(.*\bcall\s+([0-9]+)\b.*)$', lambda m: m.group(1)+'    ;; '+desc(int(m.group(2))), text)
          def callers(target):
              needle=re.compile(r'\bcall\s+'+str(target)+r'\b')
              found=[]
              for i,(a,fn) in enumerate(starts):
                  b=starts[i+1][0] if i+1<len(starts) else len(obj)
                  if needle.search(obj[a:b]): found.append(fn)
              return found

          names=['ResolveRandomArchitecture','ResolveArchitecture','ShouldAllowPackageCardFallback','CountCardsByRare','IsInitialCardCandidateAllowedByRare','AddForcedBarracksCandidates','CollectLegendaryCandidates']
          name_to_funcs={n:[] for n in names}
          for r in rows:
              sig=str(r.get('signature',''))
              for n in names:
                  if n in sig:
                      try:
                          fn=int(r['wasm_func'])
                          if fn not in name_to_funcs[n]: name_to_funcs[n].append(fn)
                      except Exception: pass

          out=['# Key SSSR fallback functions']
          for n in names:
              out += ['',f'## {n}']
              for fn in name_to_funcs[n]:
                  out.append(f'func[{fn}] {desc(fn)}')
                  out.append('callers: '+', '.join(f'func[{x}] {desc(x)}' for x in callers(fn)))
                  if fn in pos:
                      out += ['```',annotate(body(fn)),'```']
          Path('outputs/all-sssr-deck-keyfuncs.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out[:200]))
          PY
      - name: Commit analysis output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/all-sssr-deck-keyfuncs.txt
          git commit -m 'research: capture key all-SSSR fallback functions'
          git push origin HEAD:research/all-sssr-deck-hex
