name: Migrate reverse engineering references

on:
  push:
    paths:
      - '.github/workflows/migrate-canonical-reverse-references.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch source references to canonical package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          canonical='research/archive/2026-09-03/reverse-engineering/canonical'

          # Chest report: stop hashing topic-specific .wat snippets. Keep one canonical evidence entry.
          p=Path('scripts/build_chest_report.py')
          s=p.read_text(encoding='utf-8')
          old="""method_evidence = []
          for slot, fn, name, finding in methods:
              path = ROOT / f'outputs/chest-reverse/{slot}-func-{fn}.wat'
              method_evidence.append(dict(name=name, tableSlot='0x'+slot, wasmFunction=fn, finding=finding,
                                         excerptSha256=hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None))
          """
          new=f"""method_evidence = []
          for slot, fn, name, finding in methods:
              method_evidence.append(dict(
                  name=name,
                  tableSlot='0x'+slot,
                  wasmFunction=fn,
                  finding=finding,
                  evidencePath='{canonical}/method-map.tsv',
                  disassemblyPath='{canonical}/module.objdump.gz'))
          """
          if old not in s:
              raise SystemExit('build_chest_report.py evidence block not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          # README: one reverse-engineering workflow, no topic-local extraction command.
          p=Path('scripts/README.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              '本次函数复核可用 `node scripts/inspect_chest_wasm.cjs 3371 9D08 9D07 9D06 9CF9 9CFA 9CFF 3372 3373` 重建本地摘录。',
              f'函数级复核统一使用 `{canonical}/method-map.tsv` 定位方法，并在同目录的 `module.objdump.gz` / `module.wat.gz` 中读取完整函数体。')
          old_para='宝箱数据另保留 `ChestImprove01` 和 `BottomChestUI` 两个默认值。反汇编脚本依赖本地 `tools/chest-wasm/node_modules/wabt`（安装：`npm install --prefix tools/chest-wasm wabt --no-save --package-lock=false --ignore-scripts`），只读取归档WASM，输出到被Git忽略的 `outputs/chest-reverse/`。方法RVA用作WASM表槽，不当作文件偏移；共享桩的多重名称无法证明函数体语义。\n\n宝箱页面复现顺序：`node --max-old-space-size=8192 scripts/inspect_chest_wasm.cjs` → `python scripts/build_chest_report.py` → `python scripts/build_public_site.py` → `node scripts/test_chest_report.cjs`。默认提取页面引用的14个方法；完整解包资源和缓存仍在本地归档，不随页面发布。'
          new_para=f'''宝箱数据另保留 `ChestImprove01` 和 `BottomChestUI` 两个默认值。逆向证据不再生成专题私有的 `outputs/chest-reverse/`；统一由 `.github/workflows/rebuild-canonical-reverse.yml` 从固定WASM输入生成 `{canonical}/`。方法RVA用作WASM表槽，不当作文件偏移；共享桩的多重名称仍不能单独证明函数体语义。\n\n宝箱页面复现顺序：先保证 canonical 逆向包已生成，再执行 `python scripts/build_chest_report.py` → `python scripts/build_public_site.py` → `node scripts/test_chest_report.cjs`。宝箱报告只记录 canonical 方法映射与完整反汇编入口，不再维护第二套函数摘录。'''
          if old_para not in s:
              raise SystemExit('scripts/README.md old chest reverse paragraph not found')
          s=s.replace(old_para,new_para)
          p.write_text(s,encoding='utf-8')

          # Bot AI source: use canonical evidence location.
          p=Path('scripts/bot_ai_rules.md')
          s=p.read_text(encoding='utf-8')
          old='字段映射依据 `BattleHexCellState`：Coord 偏移 0，HexType 偏移 0x2C，Price 偏移 0x30；WASM 数组元素另有 16 字节数组头。证据保存在本地 `outputs/chest-reverse/eb89-func-22529.wat` 与归档 `dump.cs`。'
          new=f'字段映射依据 `BattleHexCellState`：Coord 偏移 0，HexType 偏移 0x2C，Price 偏移 0x30；WASM 数组元素另有 16 字节数组头。函数证据统一通过 `{canonical}/method-map.tsv` 与 `module.objdump.gz` 复核，声明与字段名参考归档 `dump.cs`。'
          if old not in s:
              raise SystemExit('bot_ai_rules.md old evidence sentence not found')
          p.write_text(s.replace(old,new),encoding='utf-8')

          # Historical audit report: remove obsolete folder claim but keep provenance.
          p=Path('outputs/hex-random-audit/report.md')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=s.replace(
                  '恢复元数据：`research/archive/2026-09-03/reverse-engineering/dump.cs`。函数摘录保存在本地`outputs/chest-reverse/`；沿用上次抽取器，目录名chest不代表仅分析宝箱。',
                  f'恢复元数据：`research/archive/2026-09-03/reverse-engineering/dump.cs`。完整函数反汇编与RVA映射统一保存在`{canonical}/`；不再保留按专题命名的函数摘录目录。')
              p.write_text(s,encoding='utf-8')

          # Root research answer: remove old Windows-local absolute links and redirect old snippet links to canonical method map.
          p=Path('关键问题回答.md')
          s=p.read_text(encoding='utf-8')
          old_prefix='/F:/PC-AGENT/zhancheng-card-research/'
          s=s.replace(old_prefix,'')
          s=re.sub(r'\]\(outputs/chest-reverse/[^)]+\)', f']({canonical}/method-map.tsv)', s)
          p.write_text(s,encoding='utf-8')

          # Touch canonical workflow in a deterministic way so the migration commit triggers a fresh rebuild on new master.
          p=Path('.github/workflows/rebuild-canonical-reverse.yml')
          s=p.read_text(encoding='utf-8')
          marker='# reference-migration: canonical-v1\n'
          if marker not in s:
              s += '\n' + marker
          p.write_text(s,encoding='utf-8')
          PY

      - name: Remove obsolete extraction entrypoints
        run: |
          set -euo pipefail
          git rm --ignore-unmatch scripts/inspect_chest_wasm.cjs
          git rm --ignore-unmatch .github/workflows/recover-hex-openable.yml

      - name: Rebuild affected generated reports
        run: |
          set -euo pipefail
          python -m pip install --quiet markdown pillow
          python scripts/build_chest_report.py
          python scripts/build_matching_report.py
          python scripts/build_public_site.py

      - name: Validate migrated references
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'outputs/(chest-reverse|hex-openable-reverse)' . \
            --exclude-dir=.git \
            --exclude-dir=chest-reverse \
            --exclude-dir=hex-openable-reverse \
            --exclude='rebuild-canonical-reverse.yml' \
            --exclude='migrate-canonical-reverse-references.yml'
          ! grep -R -n '/F:/PC-AGENT/zhancheng-card-research/' . --exclude-dir=.git
          grep -q 'reverse-engineering/canonical/method-map.tsv' scripts/build_chest_report.py
          grep -q 'reverse-engineering/canonical/method-map.tsv' scripts/bot_ai_rules.md
          grep -q 'reverse-engineering/canonical/method-map.tsv' docs/reports/matching/bot.html
          test ! -e scripts/inspect_chest_wasm.cjs
          test ! -e .github/workflows/recover-hex-openable.yml

      - name: Remove this one-shot migration workflow and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/migrate-canonical-reverse-references.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts outputs docs '关键问题回答.md' .github/workflows/rebuild-canonical-reverse.yml .github/workflows
          git commit -m 'research: migrate legacy reverse engineering references'
          git push
