name: Patch occupied hex docs

on:
  push:
    branches:
      - docs/occupied-hex-regeneration
    paths:
      - '.github/workflows/patch-occupied-hex-doc.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/occupied-hex-regeneration
          fetch-depth: 1
      - name: Insert occupied-hex lifecycle section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/hex_random_report.md')
          s = p.read_text(encoding='utf-8')

          anchor = "- 被占领隐藏格：存在重新生成路径，但会排除已开/不可开格、主城、桥、资源箱、特殊士兵格和部分特殊金卡建筑。\n\n所以“初始化已决定”指的是**基础隐藏结果已经生成**，不是“之后任何逻辑都绝对不能碰它”。"
          replacement = "- 被占领隐藏格：存在重新生成路径，但会排除已开/不可开格、主城、桥、资源箱、特殊士兵格和部分特殊金卡建筑。\n\n### 4.4 被占领后重新开放：这个格子会进入第二次生命周期\n\n普通首次地块可以理解为“开局预生成基础隐藏结果 → 扩张显现 → 玩家点击揭晓”。但地块被对方占领、随后又重新进入另一方可操作范围时，当前代码里存在单独的**被占领隐藏格重新生成路径**。因此这类格子不能简单理解成“把开局时同一坐标保存的旧隐藏结果再展示一次”。\n\n更合适的结构是：\n\n```text\n开局初始化该坐标的基础状态\n→ 一方打开 / 占有该格\n→ 对局中发生所有权或占领状态变化\n→ 该格重新进入可操作候选\n→ 命中被占领隐藏格的重生成路径\n→ 生成新的可再次揭晓状态\n→ 另一方之后可以再次点击\n```\n\n这条重生成路径不是对所有格子无条件执行。当前已确认会排除：已经打开或不可打开的格子、双方主城、桥格、资源箱、特殊士兵格，以及部分特殊金卡建筑等对象。也就是说，系统会先判断这个格子是否适合进入“占领后再次生成”的普通候选，而不是把所有被争夺过的坐标一律清空重抽。\n\n这里需要保留一个重要证据边界：**目前已经确认“占领后存在重新生成隐藏状态”的路径，但还没有把这条路径继续追到足以证明它到底重抽三层中的哪几层。** 现在不能严谨地断言它一定会重新抽25/50/100/250档位，也不能断言它只重抽R/SR/SSR/SSSR或只重选具体建筑。这部分应单独继续追函数链后再下结论。\n\n因此，“开局已经生成整张地图的初始隐藏布局”与“部分地块在占领后会进入第二次生成周期”可以同时成立：前者描述初始状态，后者描述对局过程中少数格子的运行时再生成。\n\n所以“初始化已决定”指的是**基础隐藏结果已经生成**，不是“之后任何逻辑都绝对不能碰它”。"
          if anchor not in s:
              raise SystemExit('occupied-hex anchor not found')
          s = s.replace(anchor, replacement, 1)

          row = "|超级召唤/神器/教程|点击或特殊流程|可能覆盖最终展示结果|\n|动态墙刷新|开格后|导航/拓扑状态，不改原始档位随机|"
          row_replacement = "|超级召唤/神器/教程|点击或特殊流程|可能覆盖最终展示结果|\n|被占领隐藏格重生成|占领/所有权变化后的特殊流程|让符合条件的格子进入第二次生成周期；当前尚未确认具体重抽哪几层|\n|动态墙刷新|开格后|导航/拓扑状态，不改原始档位随机|"
          if row not in s:
              raise SystemExit('mechanism table anchor not found')
          s = s.replace(row, row_replacement, 1)

          unanswered = "- 特殊资源内容字符串和所有候选为空时的端到端边界。\n- 当前已恢复链路没有发现实时胜率"
          unanswered_replacement = "- 特殊资源内容字符串和所有候选为空时的端到端边界。\n- 被占领隐藏格重新生成时，究竟会重新抽25/50/100/250档位、内部稀有度、具体建筑中的哪几层；当前只确认存在重生成路径和排除对象。\n- 当前已恢复链路没有发现实时胜率"
          if unanswered not in s:
              raise SystemExit('unanswered anchor not found')
          s = s.replace(unanswered, unanswered_replacement, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/hex_random_report.md
          git commit -m 'docs: explain occupied hex regeneration lifecycle'
          git push origin HEAD:docs/occupied-hex-regeneration
