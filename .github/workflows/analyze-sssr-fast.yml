name: Fast inspect SSSR fallback predicates

on:
  push:
    branches:
      - research/all-sssr-deck-hex
    paths:
      - '.github/workflows/analyze-sssr-fast.yml'

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/all-sssr-deck-hex
          fetch-depth: 1
      - name: Extract exact key bodies
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,gzip,re
          mm=Path('research/archive/2026-09-11/reverse-engineering/canonical/method-map.tsv')
          rows=[]; by_func={}
          with mm.open(encoding='utf-8',newline='') as f:
            for r in csv.DictReader(f,delimiter='\t'):
              rows.append(r)
              try: by_func.setdefault(int(r['wasm_func']),[]).append(r)
              except: pass
          obj=gzip.open('research/archive/2026-09-11/reverse-engineering/canonical/module.objdump.gz','rt',encoding='utf-8',errors='replace').read()
          starts=[(m.start(),int(m.group(1))) for m in re.finditer(r'(?m)^.*func\[([0-9]+)\].*$',obj)]
          pos={fn:i for i,(_,fn) in enumerate(starts)}
          def desc(fn):
            return ' || '.join(f"{r.get('rva_hex','')} {r.get('declaring_type_context','')}.{r.get('signature','')}" for r in by_func.get(fn,[])[:12]) or '(unnamed)'
          def body(fn):
            i=pos[fn];a=starts[i][0];b=starts[i+1][0] if i+1<len(starts) else len(obj);return obj[a:b]
          def annotated(fn):
            s=body(fn)
            return re.sub(r'(?m)^(.*\bcall\s+([0-9]+)\b.*)$',lambda m:m.group(1)+'    ;; '+desc(int(m.group(2))),s)
          wanted_names=['ResolveRandomArchitecture','ResolveArchitecture','SelectCardForHex','SelectCardForCellArchitecture','TryApplyFirstThreeCheapOpenReroll','SelectCardForRarity','SelectCardForRare','TrySelect','CountCheapOpenedHexesByPlayer']
          targets=[]
          for r in rows:
            sig=str(r.get('signature',''))
            if any(n in sig for n in wanted_names):
              try:
                fn=int(r['wasm_func'])
                if fn in pos and fn not in targets: targets.append(fn)
              except: pass
          out=['# Fast SSSR click/fallback dump','', '## selected methods']
          for fn in targets: out.append(f'func[{fn}] {desc(fn)}')
          for fn in targets:
            out += ['',f'## func[{fn}] {desc(fn)}','```',annotated(fn),'```']
          Path('outputs/all-sssr-fast.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out[:100]))
          PY
      - name: Commit output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/all-sssr-fast.txt
          git commit -m 'research: capture all-SSSR click fallback evidence'
          git push origin HEAD:research/all-sssr-deck-hex
