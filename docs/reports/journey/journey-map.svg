<svg xmlns="http://www.w3.org/2000/svg" width="800" height="920" viewBox="0 0 800 920" role="img" aria-labelledby="title desc"><title id="title">占城大师新手全路径</title><desc id="desc">基础训练后形成对战、奖励、培养循环。竞技场2、3、4依次开放领地、神器、赛季。技能和活动为条件旁路。虚线为研究合成路径而非程序调用。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#547078"/></marker></defs><rect width="800" height="920" fill="#f5f8f7"/><text x="24" y="34" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#18383e" font-weight="600">玩家全路径 · 阶段合成图</text><text x="24" y="62" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#18383e" font-weight="400">虚线为推导路径；不是强制脚本。阶段速度取决于胜负、进度与回访。</text><rect x="24" y="90" width="230" height="64" rx="9" fill="#fff" stroke="#b4c8c9"/><text x="38" y="115" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18383e" font-weight="600">J00 首次进入</text><text x="38" y="137" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#18383e" font-weight="400">登录 / 加载；未重置账号实测</text><rect x="284" y="90" width="230" height="64" rx="9" fill="#e4f2eb" stroke="#b4c8c9"/><text x="298" y="115" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18383e" font-weight="600">J01～J05 欢迎与训练</text><text x="298" y="137" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#18383e" font-weight="400">经济 / 放手 / 防守 / 拉扯</text><rect x="544" y="90" width="232" height="64" rx="9" fill="#fff" stroke="#b4c8c9"/><text x="558" y="115" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18383e" font-weight="600">J06 首次回城</text><text x="558" y="137" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#18383e" font-weight="400">训练与进度奖励分账</text><path d="M254 122 L284 122" fill="none" stroke="#547078" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M514 122 L544 122" fill="none" stroke="#547078" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="24" y="184" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#18383e" font-weight="400">确定局部链：16001→16002→1001→1002→1003→1004→1005→1006</text><text x="24" y="208" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#18383e" font-weight="400">1006之后、训练地图切换及回城奖励之间，缺运行时调度证据。</text><rect x="24" y="258" width="230" height="64" rx="9" fill="#e4f2eb" stroke="#b4c8c9"/><text x="38" y="283" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18383e" font-weight="600">J07～J09 首次养成</text><text x="38" y="305" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#18383e" font-weight="400">升级 / 通用卡 / 卡组与羁绊</text><rect x="284" y="258" width="230" height="64" rx="9" fill="#e4f2eb" stroke="#b4c8c9"/><text x="298" y="283" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18383e" font-weight="600">J10～J11 普通对战</text><text x="298" y="305" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#18383e" font-weight="400">经济 → 翻格 → 兵线 / 占地</text><rect x="544" y="258" width="232" height="64" rx="9" fill="#fff" stroke="#b4c8c9"/><text x="558" y="283" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18383e" font-weight="600">J12 胜 / J13 负</text><text x="558" y="305" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#18383e" font-weight="400">金币 / 经验 / 进度；箱子另算</text><path d="M660 154 L660 230 L139 230 L139 258" fill="none" stroke="#547078" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M254 290 L284 290" fill="none" stroke="#547078" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M514 290 L544 290" fill="none" stroke="#547078" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="544" y="356" width="232" height="64" rx="9" fill="#fff" stroke="#b4c8c9"/><text x="558" y="381" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18383e" font-weight="600">J14～J16 领奖与成长</text><text x="558" y="403" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#18383e" font-weight="400">开箱 / 缺资源 / 账号升级</text><path d="M660 322 L660 356" fill="none" stroke="#547078" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M544 388 L139 388 L139 322" fill="none" stroke="#547078" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="180" y="378" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#18383e" font-weight="400">材料反哺培养，再次开局</text><text x="24" y="465" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18383e" font-weight="600">进度解锁线：不是第2 / 3 / 4局，也不是账号等级</text><rect x="24" y="488" width="230" height="64" rx="9" fill="#eef0fa" stroke="#b4c8c9"/><text x="38" y="513" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18383e" font-weight="600">J17～J18 竞技场2：领地</text><text x="38" y="535" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#18383e" font-weight="400">木材 → 探索 / 塔属性 / 挂机</text><rect x="284" y="488" width="230" height="64" rx="9" fill="#eef0fa" stroke="#b4c8c9"/><text x="298" y="513" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18383e" font-weight="600">J19～J21 竞技场3：神器</text><text x="298" y="535" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#18383e" font-weight="400">翻格充能 / 召唤 / 培养</text><rect x="544" y="488" width="232" height="64" rx="9" fill="#eef0fa" stroke="#b4c8c9"/><text x="558" y="513" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18383e" font-weight="600">J23 竞技场4：赛季</text><text x="558" y="535" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#18383e" font-weight="400">独立PVP / 段位 / 通行证</text><path d="M254 520 L284 520" fill="none" stroke="#547078" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M514 520 L544 520" fill="none" stroke="#547078" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="24" y="595" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18383e" font-weight="600">并行旁路：分别满足自身条件，不以相邻系统为唯一前置</text><rect x="24" y="620" width="230" height="64" rx="9" fill="#fff" stroke="#b4c8c9"/><text x="38" y="645" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18383e" font-weight="600">J22 单卡6 / 12 / 18级</text><text x="38" y="667" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#18383e" font-weight="400">解锁技能槽；另需符文石</text><rect x="284" y="620" width="230" height="64" rx="9" fill="#fff" stroke="#b4c8c9"/><text x="298" y="645" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18383e" font-weight="600">J24～J25 活动与商店</text><text x="298" y="667" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#18383e" font-weight="400">签到 / 任务 / 广告 / 付费可选</text><rect x="544" y="620" width="232" height="64" rx="9" fill="#fff" stroke="#b4c8c9"/><text x="558" y="645" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18383e" font-weight="600">J26～J27 退出与回归</text><text x="558" y="667" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#18383e" font-weight="400">箱子计时 / 挂机8小时封顶</text><path d="M139 684 L139 740" fill="none" stroke="#547078" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M399 684 L399 740" fill="none" stroke="#547078" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M660 684 L660 740" fill="none" stroke="#547078" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="24" y="740" width="752" height="64" rx="9" fill="#e4f2eb" stroke="#b4c8c9"/><text x="38" y="765" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18383e" font-weight="600">J30 稳定循环：收取 → 定目标 → 对战 → 领奖 → 成长 → 再战/离开</text><text x="38" y="787" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" fill="#18383e" font-weight="400">长期目标：卡组与技能、领地主塔、神器升阶、竞技场、赛季排名</text><text x="24" y="849" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#18383e" font-weight="400">主线与各旁路最终汇入稳定循环；不承诺首周全部功能开放。</text><text x="24" y="883" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#18383e" font-weight="400">待核：训练调度、奖励先后、并行开箱、线上分流、实际首周耗时。</text></svg>